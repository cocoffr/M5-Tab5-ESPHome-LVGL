# Firmware autonome expérimental ST7121 — sans l'application domotique.
# Point d'entrée séparé : ne modifie pas tab5-ha-hmi.yaml.
substitutions:
  device_name: reveil-tab5
esphome:
  name: ${device_name}
  friendly_name: Reveil Tab5
  on_boot:
    priority: -100
    then:
      - select.set:
          id: reveil_dac_output
          option: LINE1
  includes:
    - Tab5/ecran/tab5_lien_c6.h
    - Tab5/ecran/tab5_lien_c6.cpp
    - Tab5/socle/tab5_core.h
    - Tab5/socle/tab5_batterie.h
esp32:
  board: esp32-p4-evboard
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
psram:
  mode: hex
  speed: 200MHz
logger:
# MQTT local : l'horloge et les alarmes restent autonomes sans broker.
mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: reveil-tab5
  birth_message:
    topic: reveil-tab5/disponibilite
    payload: en_ligne
  will_message:
    topic: reveil-tab5/disponibilite
    payload: hors_ligne
  on_connect:
    - mqtt.publish:
        topic: reveil-tab5/alarmes/etat
        payload: !lambda |-
          char buffer[100];
          snprintf(buffer, sizeof(buffer), "A1=%s,%02d:%02d;A2=%s,%02d:%02d",
            id(alarm_one_enabled).state ? "ON" : "OFF",
            (int) id(alarm_one_hour).state, (int) id(alarm_one_minute).state,
            id(alarm_two_enabled).state ? "ON" : "OFF",
            (int) id(alarm_two_hour).state, (int) id(alarm_two_minute).state);
          return std::string(buffer);
        retain: true
    - script.execute: publish_radio_favorites
  on_message:
    - topic: reveil-tab5/radio/commande
      payload: "ON"
      then:
        - if:
            condition:
              lambda: 'return !id(radio_manual) && !id(alarm_ringing);'
            then:
              - script.execute: toggle_radio
    - topic: reveil-tab5/radio/commande
      payload: "OFF"
      then:
        - if:
            condition:
              lambda: 'return id(radio_manual) && !id(alarm_ringing);'
            then:
              - script.execute: toggle_radio
  on_json_message:
    - topic: reveil-tab5/radio/favori/set
      then:
        - lambda: |-
            if (!x.containsKey("slot") || !x.containsKey("name") || !x.containsKey("url")) return;
            const int slot = x["slot"].as<int>();
            const std::string name = x["name"].as<std::string>();
            const std::string url = x["url"].as<std::string>();
            if (slot < 1 || slot > 12 || name.empty() || name.size() > 48 || url.size() > 255 ||
                (url.rfind("https://", 0) != 0 && url.rfind("http://", 0) != 0)) return;
            esphome::text::Text *names[] = {&id(radio_name_1),&id(radio_name_2),&id(radio_name_3),&id(radio_name_4),&id(radio_name_5),&id(radio_name_6),&id(radio_name_7),&id(radio_name_8),&id(radio_name_9),&id(radio_name_10),&id(radio_name_11),&id(radio_name_12)};
            esphome::text::Text *urls[] = {&id(radio_url_1),&id(radio_url_2),&id(radio_url_3),&id(radio_url_4),&id(radio_url_5),&id(radio_url_6),&id(radio_url_7),&id(radio_url_8),&id(radio_url_9),&id(radio_url_10),&id(radio_url_11),&id(radio_url_12)};
            auto n = names[slot-1]->make_call(); n.set_value(name); n.perform();
            auto u = urls[slot-1]->make_call(); u.set_value(url); u.perform();
            char topic[64]; snprintf(topic,sizeof(topic),"reveil-tab5/radio/favori/%d",slot);
            std::string payload;
            json::build_json([&](JsonObject root) { root["slot"]=slot; root["name"]=name; root["url"]=url; }, &payload);
            id(mqtt_client).publish(topic,payload,0,true);
api:
button:
  - platform: restart
    id: reveil_restart
    name: Redémarrer réveil
ota:
  - platform: esphome
esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  slot: 1
  sdio_frequency: 20MHz
  use_psram: true
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
sensor:
  - platform: wifi_signal
    id: reveil_wifi_signal
    name: Reveil Wi-Fi signal
    update_interval: 30s
  - platform: ina226
    id: reveil_ina226
    address: 0x41
    shunt_resistance: 0.005ohm
    max_current: 8.192A
    adc_averaging: 16
    update_interval: 15s
    bus_voltage:
      id: reveil_batt_voltage
      name: Réveil tension batterie
      on_value:
        then:
          - lambda: |-
              id(reveil_voltage_sample_ms) = millis();
    current:
      id: reveil_batt_current
      name: Réveil courant batterie
      on_value:
        then:
          - lambda: |-
              id(reveil_current_sample_ms) = millis();
  # La sonde thermique CPU est requise avant toute activation future du chargeur.
  # Sans température valide, la commande de charge reste matériellement coupée.
  - platform: internal_temperature
    id: reveil_cpu_temperature
    name: Réveil température CPU
    update_interval: 15s
    on_value:
      then:
        - lambda: |-
            id(reveil_temperature_sample_ms) = millis();
  - platform: template
    id: reveil_batterie_pourcentage
    name: Réveil batterie niveau
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    state_class: measurement
    update_interval: never
  - platform: template
    id: reveil_batterie_puissance
    name: Réveil batterie puissance
    unit_of_measurement: "W"
    accuracy_decimals: 2
    device_class: power
    state_class: measurement
    update_interval: never
  - platform: template
    id: reveil_battery_charger_locked
    name: Réveil chargeur verrouillé
    update_interval: never
  - platform: uptime
    id: reveil_uptime
    name: Reveil temps de fonctionnement
    update_interval: 60s
text_sensor:
  - platform: template
    id: reveil_batterie_diagnostic_mqtt
    name: Réveil diagnostic batterie
    update_interval: 30s
    lambda: |-
      if (!id(reveil_battery_installed).state) return {"Non installée"};
      const uint32_t now_ms = millis();
      if (!id(reveil_voltage_sample_ms) || !id(reveil_current_sample_ms) ||
          !id(reveil_temperature_sample_ms) ||
          (uint32_t)(now_ms - id(reveil_voltage_sample_ms)) > 30000UL ||
          (uint32_t)(now_ms - id(reveil_current_sample_ms)) > 30000UL ||
          (uint32_t)(now_ms - id(reveil_temperature_sample_ms)) > 30000UL)
        return {"Mesures périmées"};
      if (!id(reveil_batt_voltage).has_state() ||
          !id(reveil_batt_current).has_state() ||
          !id(reveil_cpu_temperature).has_state() ||
          !std::isfinite(id(reveil_batt_voltage).state) ||
          !std::isfinite(id(reveil_batt_current).state) ||
          !std::isfinite(id(reveil_cpu_temperature).state))
        return {"Mesures invalides"};
      if (id(reveil_charge_thermal_latch)) return {"Charge bloquée : verrou thermique"};
      if (id(reveil_batt_voltage).state < 5.5f)
        return {"Tension absente"};
      if (id(reveil_batt_voltage).state > 8.45f) return {"Charge bloquée : surtension"};
      return {"Mesures valides - charge matérielle désactivée"};
  - platform: wifi_info
    ip_address:
      id: reveil_ip
      name: Reveil adresse IP
    ssid:
      id: reveil_ssid
      name: Reveil reseau Wi-Fi
time:
  - platform: sntp
    id: clock_time
    timezone: Europe/Paris
i2c:
  sda: GPIO31
  scl: GPIO32
  frequency: 400kHz
pi4ioe5v6408:
  - id: ioexp
    address: 0x43
  - id: wifi_ioexp
    address: 0x44
esp_ldo:
  - voltage: 2.5V
    channel: 3
display:
  - platform: mipi_dsi
    id: screen
    model: M5STACK-TAB5-ST7121
    dimensions:
      width: 720
      height: 1280
    reset_pin:
      pi4ioe5v6408: ioexp
      number: 4
    pixel_mode: 16bit
    color_order: RGB
    update_interval: never
    auto_clear_enabled: false
touchscreen:
  - platform: st7123
    id: touch
    interrupt_pin: GPIO23
    reset_pin:
      pi4ioe5v6408: ioexp
      number: 5
    calibration:
      x_min: 0
      x_max: 720
      y_min: 0
      y_max: 1280
output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO22
    frequency: 1000Hz
light:
  - platform: monochromatic
    id: backlight
    name: Luminosite
    output: backlight_pwm
    restore_mode: RESTORE_DEFAULT_ON
    initial_state:
      brightness: 70%
datetime:
  - platform: template
    id: alarm_one_time
    name: Alarme 1 heure
    type: time
    optimistic: true
    initial_value: "07:00:00"
    restore_value: true
  - platform: template
    id: alarm_two_time
    name: Alarme 2 heure
    type: time
    optimistic: true
    initial_value: "08:30:00"
    restore_value: true
switch:
  # Ampli du haut-parleur interne : absent de la première version autonome.
  # GPIO 1 de l'expandeur 0x43, conformément au BSP officiel Tab5.
  - platform: gpio
    id: reveil_speaker_enable
    internal: true
    pin:
      pi4ioe5v6408: ioexp
      number: 1
    restore_mode: ALWAYS_ON
  # Alimentation matérielle ESP32-C6, indispensable au Wi-Fi du Tab5.
  - platform: gpio
    id: wifi_power
    internal: true
    pin:
      pi4ioe5v6408: wifi_ioexp
      number: 0
    restore_mode: ALWAYS_ON
  # Chargeur désactivé par défaut : activation uniquement après portage des sécurités.
  - platform: gpio
    id: reveil_charge_enable
    internal: true
    pin:
      pi4ioe5v6408: wifi_ioexp
      number: 7
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: reveil_charge_fast
    internal: true
    pin:
      pi4ioe5v6408: wifi_ioexp
      number: 5
      inverted: true
    restore_mode: ALWAYS_OFF
  # Interverrouillage explicite : aucun chargeur actif par défaut.
  - platform: template
    id: reveil_charge_authorized
    name: Autoriser charge batterie (maintenance)
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    id: reveil_battery_installed
    name: Batterie montée (déclaration)
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: alarm_one_enabled
    name: Alarme 1
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: alarm_two_enabled
    name: Alarme 2
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
# Préférences de batterie : la commande matérielle du chargeur reste
# volontairement désactivée jusqu'au portage des protections d'origine.
select:
  # Routage explicite du codec ES8388 vers les sorties analogiques.
  # Sans sélection, le DAC peut fonctionner sans alimenter le haut-parleur.
  - platform: es8388
    dac_output:
      id: reveil_dac_output
      internal: true
  - platform: template
    id: reveil_charge_limit
    name: Limite de charge souhaitée
    optimistic: true
    restore_value: true
    options: ["100 %", "80 %"]
    initial_option: "80 %"
  - platform: template
    id: reveil_charge_mode
    name: Mode de charge souhaité
    optimistic: true
    restore_value: true
    options: ["Classique", "Rapide"]
    initial_option: "Classique"
  - platform: template
    id: reveil_power_save
    name: Économie énergie
    optimistic: true
    restore_value: true
    options: ["Jamais", "Sur batterie", "Toujours"]
    initial_option: "Jamais"
  - platform: template
    id: reveil_wifi_save
    name: Wi-Fi éco
    optimistic: true
    restore_value: true
    options: ["Jamais", "Sur batterie", "Toujours"]
    initial_option: "Jamais"
  - platform: template
    id: reveil_station_radio
    name: Station radio
    optimistic: true
    restore_value: true
    options: ["Chérie FM", "Chérie FM 90", "Chérie FM Acoustic", "Rire et Chansons", "France Inter", "France Info", "RTL", "Europe 1", "RFM", "Nostalgie", "NRJ", "Fun Radio"]
    initial_option: "Chérie FM"
# Réglages locaux indépendants de Home Assistant.
number:
  - platform: template
    id: brightness_level
    name: Luminosite 1 a 10
    min_value: 1
    max_value: 10
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 5
    set_action:
      - light.turn_on:
          id: backlight
          brightness: !lambda 'return x / 10.0f;'
  - platform: template
    id: volume_level
    name: Volume 1 a 10
    min_value: 1
    max_value: 10
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 5
    set_action:
      - if:
          condition:
            lambda: 'return id(radio_manual) || (id(alarm_ringing) && id(active_alarm_radio));'
          then:
            - media_player.volume_set:
                id: radio_player
                volume: !lambda 'return x / 10.0f;'
  - platform: template
    id: alarm_one_hour
    name: Alarme 1 heures
    min_value: 0
    max_value: 23
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 7
  - platform: template
    id: alarm_one_minute
    name: Alarme 1 minutes
    min_value: 0
    max_value: 59
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 0
  - platform: template
    id: alarm_two_hour
    name: Alarme 2 heures
    min_value: 0
    max_value: 23
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 8
  - platform: template
    id: alarm_two_minute
    name: Alarme 2 minutes
    min_value: 0
    max_value: 59
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 30
# Sortie audio locale du Tab5 (ES8388 + I2S).
i2s_audio:
  - id: audio_bus
    i2s_lrclk_pin: GPIO29
    i2s_bclk_pin: GPIO27
    i2s_mclk_pin: GPIO30
audio_dac:
  - platform: es8388
    id: alarm_dac
speaker:
  - platform: i2s_audio
    id: alarm_speaker
    i2s_dout_pin: GPIO26
    audio_dac: alarm_dac
    dac_type: external
    channel: stereo
    sample_rate: 48000
    bits_per_sample: 16bit
    buffer_duration: 2000ms
  - platform: mixer
    id: reveil_mixer
    output_speaker: alarm_speaker
    source_speakers:
      - id: reveil_announcement_speaker
      - id: reveil_media_speaker
media_player:
  - platform: speaker
    id: radio_player
    name: Radio Reveil
    announcement_pipeline:
      speaker: reveil_announcement_speaker
      format: MP3
    media_pipeline:
      speaker: reveil_media_speaker
      format: MP3
    volume_min: 0.05
    volume_max: 1.0
