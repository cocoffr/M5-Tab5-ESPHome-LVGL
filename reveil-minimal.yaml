# Firmware autonome expérimental ST7121 — sans l'application domotique.
# Point d'entrée séparé : ne modifie pas tab5-ha-hmi.yaml.
substitutions:
  device_name: reveil-tab5
esphome:
  name: ${device_name}
  friendly_name: Reveil Tab5
  includes:
    - Tab5/ecran/tab5_lien_c6.h
    - Tab5/ecran/tab5_lien_c6.cpp
esp32:
  board: esp32-p4-evboard
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
psram:
  mode: hex
  speed: 200MHz
logger:
api:
ota:
  - platform: esphome
esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  slot: 1
  sdio_frequency: 20MHz
  use_psram: true
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
time:
  - platform: sntp
    id: clock_time
    timezone: Europe/Paris
i2c:
  sda: GPIO31
  scl: GPIO32
  frequency: 400kHz
pi4ioe5v6408:
  - id: ioexp
    address: 0x43
  - id: wifi_ioexp
    address: 0x44
esp_ldo:
  - voltage: 2.5V
    channel: 3
display:
  - platform: mipi_dsi
    id: screen
    model: M5STACK-TAB5-ST7121
    dimensions:
      width: 720
      height: 1280
    reset_pin:
      pi4ioe5v6408: ioexp
      number: 4
    pixel_mode: 16bit
    color_order: RGB
    update_interval: never
    auto_clear_enabled: false
touchscreen:
  - platform: st7123
    id: touch
    interrupt_pin: GPIO23
    reset_pin:
      pi4ioe5v6408: ioexp
      number: 5
    calibration:
      x_min: 0
      x_max: 720
      y_min: 0
      y_max: 1280
output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO22
    frequency: 1000Hz
light:
  - platform: monochromatic
    id: backlight
    name: Luminosite
    output: backlight_pwm
    restore_mode: RESTORE_DEFAULT_ON
    initial_state:
      brightness: 70%
datetime:
  - platform: template
    id: alarm_one_time
    name: Alarme 1 heure
    type: time
    optimistic: true
    initial_value: "07:00:00"
    restore_value: true
  - platform: template
    id: alarm_two_time
    name: Alarme 2 heure
    type: time
    optimistic: true
    initial_value: "08:30:00"
    restore_value: true
switch:
  # Alimentation matérielle ESP32-C6, indispensable au Wi-Fi du Tab5.
  - platform: gpio
    id: wifi_power
    internal: true
    pin:
      pi4ioe5v6408: wifi_ioexp
      number: 0
    restore_mode: ALWAYS_ON
  - platform: template
    id: alarm_one_enabled
    name: Alarme 1
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: alarm_two_enabled
    name: Alarme 2
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
# Réglages locaux indépendants de Home Assistant.
number:
  - platform: template
    id: brightness_level
    name: Luminosite 1 a 10
    min_value: 1
    max_value: 10
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 5
    set_action:
      - light.turn_on:
          id: backlight
          brightness: !lambda 'return x / 10.0f;'
  - platform: template
    id: volume_level
    name: Volume 1 a 10
    min_value: 1
    max_value: 10
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 5
    set_action:
      - if:
          condition:
            lambda: 'return id(radio_manual) && !id(alarm_ringing);'
          then:
            - media_player.volume_set:
                id: radio_player
                volume: !lambda 'return x / 10.0f;'
  - platform: template
    id: alarm_one_hour
    name: Alarme 1 heures
    min_value: 0
    max_value: 23
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 7
  - platform: template
    id: alarm_one_minute
    name: Alarme 1 minutes
    min_value: 0
    max_value: 59
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 0
  - platform: template
    id: alarm_two_hour
    name: Alarme 2 heures
    min_value: 0
    max_value: 23
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 8
  - platform: template
    id: alarm_two_minute
    name: Alarme 2 minutes
    min_value: 0
    max_value: 59
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 30
# Sortie audio locale du Tab5 (ES8388 + I2S).
i2s_audio:
  - id: audio_bus
    i2s_lrclk_pin: GPIO29
    i2s_bclk_pin: GPIO27
    i2s_mclk_pin: GPIO30
audio_dac:
  - platform: es8388
    id: alarm_dac
speaker:
  - platform: i2s_audio
    id: alarm_speaker
    i2s_dout_pin: GPIO26
    audio_dac: alarm_dac
    dac_type: external
    channel: stereo
    sample_rate: 48000
    bits_per_sample: 16bit
    buffer_duration: 2000ms
media_player:
  - platform: speaker
    id: radio_player
    name: Radio Reveil
    announcement_pipeline:
      speaker: alarm_speaker
      format: MP3
    volume_min: 0.05
    volume_max: 1.0
globals:
  - id: lien_c6_branche
    type: bool
    initial_value: 'lien_c6_demarrage()'
  - id: manual_clock
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: manual_hour
    type: int
    restore_value: yes
    initial_value: '7'
  - id: manual_minute
    type: int
    restore_value: yes
    initial_value: '0'
  - id: manual_last_tick
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_alarm_minute
    type: int
    restore_value: no
    initial_value: '-1'
  - id: snooze_deadline_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: snooze_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: radio_manual
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: selected_alarm
    type: int
    restore_value: no
    initial_value: '1'
  - id: alarm_one_radio
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: alarm_two_radio
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: alarm_one_volume
    type: int
    restore_value: yes
    initial_value: '5'
  - id: alarm_two_volume
    type: int
    restore_value: yes
    initial_value: '5'
  - id: active_alarm_radio
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: alarm_ringing
    type: bool
    restore_value: no
    initial_value: 'false'
script:
  - id: open_clock_settings
    then:
      - lvgl.page.show: clock_settings_page
  - id: manual_clock_adjust_hour
    parameters:
      delta: int
    then:
      - lambda: |-
          id(manual_hour) = (id(manual_hour) + delta + 24) % 24;
          id(manual_last_tick) = millis();
  - id: manual_clock_adjust_minute
    parameters:
      delta: int
    then:
      - lambda: |-
          id(manual_minute) = (id(manual_minute) + delta + 60) % 60;
          id(manual_last_tick) = millis();
  - id: set_manual_clock
    then:
      - lambda: |-
          if (!id(manual_clock)) {
            auto t = id(clock_time).now();
            if (t.is_valid()) { id(manual_hour) = t.hour; id(manual_minute) = t.minute; }
          }
          id(manual_clock) = true;
          id(manual_last_tick) = millis();
          id(last_alarm_minute) = -1;
  - id: set_auto_clock
    then:
      - lambda: |-
          id(manual_clock) = false;
          id(last_alarm_minute) = -1;
  - id: toggle_radio
    then:
      - if:
          condition:
            lambda: 'return id(radio_manual);'
          then:
            - lambda: 'id(radio_manual) = false;'
            - media_player.stop: radio_player
          else:
            - lambda: 'id(radio_manual) = true;'
            - media_player.volume_set:
                id: radio_player
                volume: !lambda 'return id(volume_level).state / 10.0f;'
            - media_player.play_media:
                id: radio_player
                media_url: "https://streaming.nrjaudio.fm/ouuku85n3nje?origine=fluxradios"
                announcement: true
  - id: start_alarm
    then:
      - lambda: 'id(alarm_ringing) = true; id(radio_manual) = false;'
      - lvgl.page.show: alarm_ringing_page
      - if:
          condition:
            lambda: 'return id(active_alarm_radio);'
          then:
            - media_player.volume_set:
                id: radio_player
                volume: !lambda 'return (id(selected_alarm) == 1 ? id(alarm_one_volume) : id(alarm_two_volume)) / 10.0f;'
            - media_player.play_media:
                id: radio_player
                media_url: "https://streaming.nrjaudio.fm/ouuku85n3nje?origine=fluxradios"
                announcement: true
          else:
            - rtttl.play:
                id: alarm_buzzer
                rtttl: "reveil:d=8,o=5,b=120:c6,p,c6,p,g5,p,g5,p"
  - id: stop_alarm
    then:
      - lambda: 'id(alarm_ringing) = false; id(snooze_pending) = false; id(radio_manual) = false;'
      - rtttl.stop:
          id: alarm_buzzer
      - media_player.stop: radio_player
      - lvgl.page.show: reveil_page
  - id: snooze_alarm
    then:
      - lambda: |-
          if (id(alarm_ringing)) {
            // Compte à rebours monotone : reste fiable si l'heure est corrigée.
            id(snooze_deadline_ms) = millis() + 9UL * 60000UL;
            id(snooze_pending) = true;
            id(alarm_ringing) = false;
          }
      - rtttl.stop:
          id: alarm_buzzer
      - media_player.stop: radio_player
      - lvgl.page.show: reveil_page
  - id: open_alarm_one
    then:
      - lambda: 'id(selected_alarm) = 1;'
      - lvgl.page.show: alarm_settings_page
  - id: open_alarm_two
    then:
      - lambda: 'id(selected_alarm) = 2;'
      - lvgl.page.show: alarm_settings_page
  - id: adjust_alarm_hour
    parameters:
      delta: int
    then:
      - lambda: |-
          auto &n = id(selected_alarm) == 1 ? id(alarm_one_hour) : id(alarm_two_hour);
          auto call = n->make_call();
          call.set_value(((int)n->state + delta + 24) % 24);
          call.perform();
  - id: adjust_alarm_minute
    parameters:
      delta: int
    then:
      - lambda: |-
          auto &n = id(selected_alarm) == 1 ? id(alarm_one_minute) : id(alarm_two_minute);
          auto call = n->make_call();
          call.set_value(((int)n->state + delta + 60) % 60);
          call.perform();
  - id: adjust_alarm_volume
    parameters:
      delta: int
    then:
      - lambda: |-
          int &v = id(selected_alarm) == 1 ? id(alarm_one_volume) : id(alarm_two_volume);
          v = std::max(1, std::min(10, v + delta));
  - id: select_alarm_buzzer
    then:
      - lambda: |-
          if (id(selected_alarm) == 1) id(alarm_one_radio) = false;
          else id(alarm_two_radio) = false;
  - id: select_alarm_radio
    then:
      - lambda: |-
          if (id(selected_alarm) == 1) id(alarm_one_radio) = true;
          else id(alarm_two_radio) = true;

rtttl:
  id: alarm_buzzer
  speaker: alarm_speaker
  gain: 50%
font:
  - file: "gfonts://Noto Sans Symbols 2"
    id: icon_font
    size: 44
    glyphs: "☀⚡"
  - file: "gfonts://Roboto"
    id: label_font
    size: 36
    glyphs: "0123456789: /+-ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz."
