                    auto &h = id(selected_alarm) == 1 ? id(alarm_one_hour) : id(alarm_two_hour);
                    auto &m = id(selected_alarm) == 1 ? id(alarm_one_minute) : id(alarm_two_minute);
                    auto hc = h->make_call(); hc.set_value(id(preset_original_hour)); hc.perform();
                    auto mc = m->make_call(); mc.set_value(id(preset_original_minute)); mc.perform();
                  }
                  id(preset_edit) = false;
                  id(preset_selected) = -1;
            widgets:
              - label: { text: "Annuler", align: CENTER, text_font: label_font }
        - button:
            id: preset_save_button
            x: 965
            y: 610
            width: 260
            height: 72
            bg_color: 0x075BA8
            on_click:
              - script.execute: save_preset
            widgets:
              - label:
                  text: "Enregistrer"
                  align: CENTER
                  text_font: label_font

interval:
  - interval: 1s
    then:
      - lambda: |-
          auto t = id(clock_time).now();
          // Evite de redessiner les labels LVGL dont le texte n'a pas changé.
          auto set_label_if_changed = [](lv_obj_t *label, const char *value) {
            if (strcmp(lv_label_get_text(label), value) != 0) lv_label_set_text(label, value);
          };
          if (id(manual_clock)) {
            uint32_t now_ms = millis();
            if (id(manual_last_tick) == 0) id(manual_last_tick) = now_ms;
            while ((uint32_t)(now_ms - id(manual_last_tick)) >= 60000UL) {
              id(manual_last_tick) += 60000UL;
              if (++id(manual_minute) >= 60) { id(manual_minute) = 0; id(manual_hour) = (id(manual_hour) + 1) % 24; }
            }
          }
          const bool clock_valid = id(manual_clock) || t.is_valid();
          const int shown_hour = id(manual_clock) ? id(manual_hour) : t.hour;
          const int shown_minute = id(manual_clock) ? id(manual_minute) : t.minute;
          static int last_drawn_minute = -1;
          const int current_drawn_minute = clock_valid ? shown_hour * 60 + shown_minute : -1;
          if (clock_valid && current_drawn_minute != last_drawn_minute) {
            last_drawn_minute = current_drawn_minute;
            const uint8_t map[10] = {0x3F, 0x06, 0x5B, 0x4F, 0x66, 0x6D, 0x7D, 0x07, 0x7F, 0x6F};
            int digits[4] = {shown_hour / 10, shown_hour % 10, shown_minute / 10, shown_minute % 10};
            // Masquer la dizaine des heures entre 00:00 et 09:59.
            const uint8_t first_hour_segments = shown_hour < 10 ? 0 : map[digits[0]];
            lv_obj_set_style_bg_color(id(digit_0_0), lv_color_hex((first_hour_segments & (1 << 0)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_0_1), lv_color_hex((first_hour_segments & (1 << 1)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_0_2), lv_color_hex((first_hour_segments & (1 << 2)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_0_3), lv_color_hex((first_hour_segments & (1 << 3)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_0_4), lv_color_hex((first_hour_segments & (1 << 4)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_0_5), lv_color_hex((first_hour_segments & (1 << 5)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_0_6), lv_color_hex((first_hour_segments & (1 << 6)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_1_0), lv_color_hex((map[digits[1]] & (1 << 0)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_1_1), lv_color_hex((map[digits[1]] & (1 << 1)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_1_2), lv_color_hex((map[digits[1]] & (1 << 2)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_1_3), lv_color_hex((map[digits[1]] & (1 << 3)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_1_4), lv_color_hex((map[digits[1]] & (1 << 4)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_1_5), lv_color_hex((map[digits[1]] & (1 << 5)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_1_6), lv_color_hex((map[digits[1]] & (1 << 6)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_2_0), lv_color_hex((map[digits[2]] & (1 << 0)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_2_1), lv_color_hex((map[digits[2]] & (1 << 1)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_2_2), lv_color_hex((map[digits[2]] & (1 << 2)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_2_3), lv_color_hex((map[digits[2]] & (1 << 3)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_2_4), lv_color_hex((map[digits[2]] & (1 << 4)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_2_5), lv_color_hex((map[digits[2]] & (1 << 5)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_2_6), lv_color_hex((map[digits[2]] & (1 << 6)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_3_0), lv_color_hex((map[digits[3]] & (1 << 0)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_3_1), lv_color_hex((map[digits[3]] & (1 << 1)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_3_2), lv_color_hex((map[digits[3]] & (1 << 2)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_3_3), lv_color_hex((map[digits[3]] & (1 << 3)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_3_4), lv_color_hex((map[digits[3]] & (1 << 4)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_3_5), lv_color_hex((map[digits[3]] & (1 << 5)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_3_6), lv_color_hex((map[digits[3]] & (1 << 6)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
          }
          static int last_drawn_day = -1;
          if (id(manual_clock)) {
            set_label_if_changed(id(date_label), "Heure manuelle");
            last_drawn_day = -1;
          }
          if (!id(manual_clock) && t.is_valid() && t.day_of_year != last_drawn_day) {
            last_drawn_day = t.day_of_year;
            const char *jours[] = {"dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"};
            const char *mois[] = {"janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"};
            char date_text[64];
            snprintf(date_text, sizeof(date_text), "%s %d %s", jours[t.day_of_week - 1], t.day_of_month, mois[t.month - 1]);
            set_label_if_changed(id(date_label), date_text);
          }
          // Contrôleur de charge : calcul des décisions, sorties verrouillées en attente des essais matériels.
          char pref[48];
          snprintf(pref, sizeof(pref), "%s (inactif)", id(reveil_charge_limit).current_option().c_str());
          set_label_if_changed(id(reveil_charge_limit_label), pref);
          snprintf(pref, sizeof(pref), "%s (inactif)", id(reveil_charge_mode).current_option().c_str());
          set_label_if_changed(id(reveil_charge_mode_label), pref);
          set_label_if_changed(id(reveil_power_save_label), id(reveil_power_save).current_option().c_str());
          set_label_if_changed(id(reveil_wifi_save_label), id(reveil_wifi_save).current_option().c_str());
          set_label_if_changed(id(reveil_battery_installed_label), id(reveil_battery_installed).state ? "Oui" : "Non");
          // La présence déclarée seule ne suffit pas : chargeur coupé au démarrage.
          // Contrôleur original importé en lecture seule pour diagnostic.
          // L'interverrouillage de sécurité interdit toute activation de CHG_EN
          // tant que le portage complet des transitions/sondes n'est pas validé.
          static EtatChargeur controle_charge;
          static bool controle_initialise = false;
          if (!controle_initialise) {
            chargeur_demarrer(controle_charge, id(reveil_battery_memory),
              id(reveil_battery_installed).state, true, id(reveil_charge_thermal_latch), millis());
            controle_initialise = true;
          }
          // Les valeurs INA226 sont publiées toutes les 15 s : ne pas traiter
          // 15 fois la même lecture comme autant de nouvelles mesures.
          const float tension = id(reveil_batt_voltage).has_state() ? id(reveil_batt_voltage).state : NAN;
          const float courant = id(reveil_batt_current).has_state() ? id(reveil_batt_current).state : NAN;
          // Ne transmettre que les mesures réellement renouvelées par INA226.
          // Une valeur inchangée reste une nouvelle mesure si on_value a été appelé.
          static uint32_t tension_traitee_ms = 0;
          static uint32_t courant_traite_ms = 0;
          if (id(reveil_voltage_sample_ms) != 0 &&
              id(reveil_voltage_sample_ms) != tension_traitee_ms && std::isfinite(tension)) {
            tension_traitee_ms = id(reveil_voltage_sample_ms);
            chargeur_lecture(controle_charge, tension, millis());
          }
          if (id(reveil_current_sample_ms) != 0 &&
              id(reveil_current_sample_ms) != courant_traite_ms && std::isfinite(courant)) {
            courant_traite_ms = id(reveil_current_sample_ms);
            chargeur_lecture_courant(controle_charge, courant, millis());
          }
          if (id(reveil_cpu_temperature).has_state()) {
            chargeur_surveillance_thermique(controle_charge, id(reveil_cpu_temperature).state, millis());
          } else {
            chargeur_surveillance_thermique(controle_charge, NAN, millis());
          }
          // Exécute la machine d'états d'origine : repos de sonde 8 s,
          // contrôle présence, limite 80/100 %, sonde périodique et verrous.
          const uint8_t limite = id(reveil_charge_limit).current_option() == "80 %" ? 1 : 0;
          const ActionChargeur decision = chargeur_tick(controle_charge, limite,
            id(reveil_battery_installed).state, millis());
          // Persistance du souvenir de batterie et du verrou thermique.
          // Le verrou est conservé après redémarrage et empêche toute charge.
          const uint8_t next_memory = batterie_memoire_suivante(controle_charge, id(reveil_battery_memory));
          if (next_memory != id(reveil_battery_memory)) id(reveil_battery_memory) = next_memory;
          if (controle_charge.verrou_thermique) id(reveil_charge_thermal_latch) = true;
          const bool charge_bloquee = id(reveil_charge_thermal_latch) || chargeur_securite_posee(controle_charge);
          id(reveil_battery_charger_locked).publish_state(charge_bloquee ? 1.0f : 0.0f);
          const SignalSecurite signal = chargeur_signal_prendre(controle_charge);
          if (signal.cause != CauseSecurite::AUCUNE) {
            char message[96];
            snprintf(message, sizeof(message), "cause=%d;mesure=%.2f;verrou=%d",
              (int)signal.cause, signal.mesure, signal.verrouille ? 1 : 0);
            id(mqtt_client).publish("reveil-tab5/batterie/securite", message, 0, true);
          }
          // La machine d'états demande une lecture de confirmation :
          // forcer un vrai cycle INA226, pas recycler le dernier état publié.
          if (decision.lire) id(reveil_ina226).update();
          // Mode simulation sûr : le contrôleur calcule les ordres, mais
          // aucun ordre d'activation ne peut atteindre le matériel.
          // L'INA226 en mode simulation voit donc toujours CHG_EN coupé.
          constexpr bool kChargeMaterielleValidee = false;
          const uint32_t maintenant = millis();
          const bool mesures_fraiches =
            id(reveil_voltage_sample_ms) != 0 && id(reveil_current_sample_ms) != 0 &&
            id(reveil_temperature_sample_ms) != 0 &&
            (uint32_t)(maintenant - id(reveil_voltage_sample_ms)) <= 30000UL &&
            (uint32_t)(maintenant - id(reveil_current_sample_ms)) <= 30000UL &&
            (uint32_t)(maintenant - id(reveil_temperature_sample_ms)) <= 30000UL;
          const bool mesures_valides = mesures_fraiches &&
            std::isfinite(tension) && tension >= 5.5f && tension <= 8.45f &&
            std::isfinite(courant) &&
            id(reveil_cpu_temperature).has_state() &&
            std::isfinite(id(reveil_cpu_temperature).state);
          const bool autorise = kChargeMaterielleValidee &&
            id(reveil_charge_authorized).state &&
            id(reveil_battery_installed).state && mesures_valides &&
            !id(reveil_charge_thermal_latch) &&
            !chargeur_securite_posee(controle_charge);
          const bool activer = autorise && decision.allumer;
          if (!activer && id(reveil_charge_fast).state) id(reveil_charge_fast).turn_off();
          if (id(reveil_charge_enable).state != activer) {
            if (activer) id(reveil_charge_enable).turn_on();
            else id(reveil_charge_enable).turn_off();
          }
          const bool rapide = activer &&
            id(reveil_charge_mode).current_option() == "Rapide";
          if (id(reveil_charge_fast).state != rapide) {
            if (rapide) id(reveil_charge_fast).turn_on();
            else id(reveil_charge_fast).turn_off();
          }
          // En simulation, les états internes ne doivent pas croire qu'une
          // commande de charge a effectivement été appliquée.
          if (!activer && controle_charge.allume) {
            chargeur_commander(controle_charge, false, millis());
            controle_charge.reveil = false;
          }
          const bool batt_present = id(reveil_battery_installed).state &&
            mesures_fraiches && controle_charge.presence == PresenceBatterie::PRESENTE &&
            id(reveil_batt_voltage).has_state() &&
            std::isfinite(id(reveil_batt_voltage).state) &&
            id(reveil_batt_voltage).state >= 5.5f && id(reveil_batt_voltage).state <= 8.45f;
          // Indication de décharge seulement, pas une mesure directe du secteur USB.
          const bool on_battery = batt_present && !id(reveil_charge_enable).state &&
            id(reveil_batt_current).has_state() &&
            std::isfinite(id(reveil_batt_current).state) &&
            id(reveil_batt_current).state > 0.05f;
          // Indicateur de présence : ne pas confondre batterie déclarée et détectée.
          // Le statut de l'alimentation secteur est indisponible dans cette version :
          // le courant batterie ne suffit pas à identifier avec certitude l'USB.
          const std::string power_mode = id(reveil_power_save).current_option();
          const bool eco_screen = power_mode == "Toujours" ||
            (power_mode == "Sur batterie" && on_battery);
          static int previous_screen_pct = -1;
          const int requested_screen_pct = (int)(id(brightness_level).state * 10.0f);
          const int effective_screen_pct = eco_screen ? std::min(requested_screen_pct, 30) : requested_screen_pct;
          if (effective_screen_pct != previous_screen_pct) {
            previous_screen_pct = effective_screen_pct;
            auto call = id(backlight).turn_on();
            call.set_brightness(effective_screen_pct / 100.0f);
            call.perform();
          }
          // Wi-Fi éco conservé comme préférence : ne pas couper le réseau
          // nécessaire à la synchronisation SNTP et à la radio.
          // Diagnostics locaux, sans dépendance aux entités domotiques du projet HMI.
          set_label_if_changed(id(sys_ssid), id(reveil_ssid).has_state() ? id(reveil_ssid).state.c_str() : "--");
          set_label_if_changed(id(sys_ip), id(reveil_ip).has_state() ? id(reveil_ip).state.c_str() : "--");
          char diag[48];
          if (id(reveil_wifi_signal).has_state() && std::isfinite(id(reveil_wifi_signal).state)) {
            snprintf(diag, sizeof(diag), "%.0f dBm", id(reveil_wifi_signal).state);
            set_label_if_changed(id(sys_rssi), diag);
          } else set_label_if_changed(id(sys_rssi), "Indisponible");
          if (id(reveil_uptime).has_state() && std::isfinite(id(reveil_uptime).state)) {
            const uint32_t secondes = (uint32_t) id(reveil_uptime).state;
            snprintf(diag, sizeof(diag), "%u j %02u h %02u min",
              (unsigned)(secondes / 86400), (unsigned)((secondes / 3600) % 24),
              (unsigned)((secondes / 60) % 60));
            set_label_if_changed(id(sys_uptime), diag);
          } else set_label_if_changed(id(sys_uptime), "Indisponible");
          snprintf(diag, sizeof(diag), "%u / %u Ko",
            (unsigned)(heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
            (unsigned)(heap_caps_get_total_size(MALLOC_CAP_INTERNAL) / 1024));
          set_label_if_changed(id(sys_sram), diag);
          snprintf(diag, sizeof(diag), "%u / %u Ko",
            (unsigned)(heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
            (unsigned)(heap_caps_get_total_size(MALLOC_CAP_SPIRAM) / 1024));
          set_label_if_changed(id(sys_psram), diag);
          snprintf(diag, sizeof(diag), "%u Ko", (unsigned)(heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024)); set_label_if_changed(id(sys_bloc), diag);
          if (id(reveil_cpu_temperature).has_state() &&
              std::isfinite(id(reveil_cpu_temperature).state)) {
            snprintf(diag, sizeof(diag), "%.1f °C", id(reveil_cpu_temperature).state);
            set_label_if_changed(id(sys_temp), diag);
          } else set_label_if_changed(id(sys_temp), "Non mesurée");
          // Utilisation CPU mesurée à partir du temps idle FreeRTOS.
          #if defined(configGENERATE_RUN_TIME_STATS) && configGENERATE_RUN_TIME_STATS
          {
            static uint32_t last_idle = 0;
            static uint32_t last_total = 0;
            const TaskHandle_t idle_task = xTaskGetIdleTaskHandleForCore(0);
            const uint32_t idle_now = idle_task ? ulTaskGetRunTimeCounter(idle_task) : 0;
            const uint32_t total_now = portGET_RUN_TIME_COUNTER_VALUE();
            if (last_total && total_now != last_total) {
              const uint32_t delta_total = total_now - last_total;
              const uint32_t delta_idle = idle_now - last_idle;
              const float load = 100.0f * (1.0f - std::min(1.0f, (float)delta_idle / delta_total));
              snprintf(diag, sizeof(diag), "%.0f %%", load);
              set_label_if_changed(id(sys_cpu), diag);
            }
            last_idle = idle_now;
            last_total = total_now;
          }
          #else
          set_label_if_changed(id(sys_cpu), "Indisponible");
          #endif
          if (batt_present) {
            snprintf(diag, sizeof(diag), "%.2f V", id(reveil_batt_voltage).state);
            set_label_if_changed(id(reveil_batt_tension), diag);
            set_label_if_changed(id(sys_batt), diag);
            set_label_if_changed(id(reveil_batt_etat), on_battery ? "Sur batterie" : "Détectée");
            if (on_battery && id(reveil_batt_current).state >= 0.020f) {
              snprintf(diag, sizeof(diag), "%.2f W", id(reveil_batt_voltage).state * id(reveil_batt_current).state);
              set_label_if_changed(id(reveil_batt_conso), diag);
            } else {
              set_label_if_changed(id(reveil_batt_conso), "--");
            }
            // Courbe 2S à 25 points du contrôleur batterie du projet d'origine.
            // Indication seulement, sans commande de charge et sans compensation
            // de la tension sous courant : précision limitée.
            static const uint16_t curve_mv[] = {
              3300,3350,3500,3550,3625,3675,3700,3725,3750,3775,
              3800,3825,3850,3875,3900,3925,3950,3975,4000,4025,
              4050,4075,4100,4125,4175
            };
            static const uint8_t curve_pct[] = {
              0,1,2,3,4,5,7,11,13,15,18,22,30,41,47,51,53,57,
              62,81,90,95,97,98,100
            };
            const float cell_mv = id(reveil_batt_voltage).state * 500.0f;
            float pct = 100.0f;
            if (cell_mv <= curve_mv[0]) pct = 0.0f;
            else for (size_t i = 1; i < 25; ++i) {
              if (cell_mv <= curve_mv[i]) {
                pct = curve_pct[i-1] + (cell_mv - curve_mv[i-1]) *
                  (curve_pct[i] - curve_pct[i-1]) /
                  float(curve_mv[i] - curve_mv[i-1]);
                break;
              }
            }
            id(reveil_batterie_pourcentage).publish_state(pct);
            if (on_battery && std::isfinite(courant)) id(reveil_batterie_puissance).publish_state(std::max(0.0f, tension * courant));
            else id(reveil_batterie_puissance).publish_state(NAN);
            // Alertes une seule fois par seuil lors d'une décharge, réarmées à 30 %.
            if (!on_battery || pct >= 30.0f) id(reveil_battery_alert_level) = 0;
            if (on_battery && pct <= 10.0f && id(reveil_battery_alert_level) < 2) {
              id(reveil_battery_alert_level) = 2;
              id(mqtt_client).publish("reveil-tab5/batterie/alerte", "critique_10", 0, false);
            } else if (on_battery && pct <= 20.0f && id(reveil_battery_alert_level) < 1) {
              id(reveil_battery_alert_level) = 1;
              id(mqtt_client).publish("reveil-tab5/batterie/alerte", "faible_20", 0, false);
            }
            snprintf(diag, sizeof(diag), "~%.0f %%", pct);
            set_label_if_changed(id(reveil_batt_niveau), diag);
          } else {
            id(reveil_batterie_pourcentage).publish_state(NAN);
            id(reveil_batterie_puissance).publish_state(NAN);
            id(reveil_battery_alert_level) = 0;
            set_label_if_changed(id(sys_batt), "Non détectée");
            set_label_if_changed(id(reveil_batt_etat),
            id(reveil_battery_installed).state ? "Mesure absente / batterie à vérifier" : "Non installée");
            set_label_if_changed(id(reveil_batt_tension), "--");
            set_label_if_changed(id(reveil_batt_niveau), "--");
            set_label_if_changed(id(reveil_batt_conso), "--");
          }
          char clock_value[16];
          snprintf(clock_value, sizeof(clock_value), "%02d", id(manual_hour));
          set_label_if_changed(id(clock_hour_label), clock_value);
          snprintf(clock_value, sizeof(clock_value), "%02d", id(manual_minute));
          set_label_if_changed(id(clock_minute_label), clock_value);
          lv_obj_set_style_bg_color(id(clock_wifi_button), lv_color_hex(!id(manual_clock) ? 0x00AD22 : 0x304458), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(clock_manual_button), lv_color_hex(id(manual_clock) ? 0x00AD22 : 0x304458), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(reveil_wifi_icon), lv_color_hex(id(reveil_ip).has_state() && !id(reveil_ip).state.empty() && id(reveil_ip).state != "0.0.0.0" ? 0x00AD22 : 0x535B65), LV_PART_MAIN);
          set_label_if_changed(id(clock_mode_label), id(manual_clock) ? "Mode manuel actif" : (t.is_valid() ? "Mode Wi-Fi actif" : "Wi-Fi : non synchronise"));
          if (id(alarm_ringing)) {
            lv_obj_remove_flag(id(alarm_snooze_main_button), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(alarm_stop_main_button), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(alarm_snooze_main_button), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(alarm_stop_main_button), LV_OBJ_FLAG_HIDDEN);
          }
          set_label_if_changed(id(alarm_one_label), id(alarm_one_enabled).state ? "ON" : "OFF");
          static int last_one_enabled = -1;
          int one_enabled = id(alarm_one_enabled).state ? 1 : 0;
          if (one_enabled != last_one_enabled) {
            last_one_enabled = one_enabled;
            lv_obj_set_style_bg_color(id(alarm_one_button), lv_color_hex(one_enabled ? 0x00AD22 : 0x535B65), LV_PART_MAIN);
          }
          // Retour MQTT uniquement lors d'un changement de configuration.
          static std::string last_mqtt_alarm_state;
          char alarm_mqtt[100];
          snprintf(alarm_mqtt, sizeof(alarm_mqtt), "A1=%s,%02d:%02d;A2=%s,%02d:%02d",
            id(alarm_one_enabled).state ? "ON" : "OFF",
            (int) id(alarm_one_hour).state, (int) id(alarm_one_minute).state,
            id(alarm_two_enabled).state ? "ON" : "OFF",
            (int) id(alarm_two_hour).state, (int) id(alarm_two_minute).state);
          if (last_mqtt_alarm_state != alarm_mqtt) {
            last_mqtt_alarm_state = alarm_mqtt;
            id(mqtt_client).publish("reveil-tab5/alarmes/etat", alarm_mqtt, 0, true);
          }
          set_label_if_changed(id(alarm_two_label), id(alarm_two_enabled).state ? "ON" : "OFF");
          static int last_two_enabled = -1;
          int two_enabled = id(alarm_two_enabled).state ? 1 : 0;
          if (two_enabled != last_two_enabled) {
            last_two_enabled = two_enabled;
            lv_obj_set_style_bg_color(id(alarm_two_button), lv_color_hex(two_enabled ? 0x00AD22 : 0x535B65), LV_PART_MAIN);
          }
          char value[16];
          snprintf(value, sizeof(value), "%.0f/10", id(brightness_level).state);
          set_label_if_changed(id(brightness_label), value);
          snprintf(value, sizeof(value), "%.0f/10", id(volume_level).state);
          set_label_if_changed(id(volume_label), value);
          const std::string radio_names[] = {id(radio_name_1).state, id(radio_name_2).state, id(radio_name_3).state, id(radio_name_4).state, id(radio_name_5).state, id(radio_name_6).state, id(radio_name_7).state, id(radio_name_8).state, id(radio_name_9).state, id(radio_name_10).state, id(radio_name_11).state, id(radio_name_12).state};
          set_label_if_changed(id(radio_station_label_1), radio_names[0].c_str());
          set_label_if_changed(id(radio_station_label_2), radio_names[1].c_str());
          set_label_if_changed(id(radio_station_label_3), radio_names[2].c_str());
          set_label_if_changed(id(radio_station_label_4), radio_names[3].c_str());
          set_label_if_changed(id(radio_station_label_5), radio_names[4].c_str());
          set_label_if_changed(id(radio_station_label_6), radio_names[5].c_str());
          set_label_if_changed(id(radio_station_label_7), radio_names[6].c_str());
          set_label_if_changed(id(radio_station_label_8), radio_names[7].c_str());
          set_label_if_changed(id(radio_station_label_9), radio_names[8].c_str());
          set_label_if_changed(id(radio_station_label_10), radio_names[9].c_str());
          set_label_if_changed(id(radio_station_label_11), radio_names[10].c_str());
          set_label_if_changed(id(radio_station_label_12), radio_names[11].c_str());
          set_label_if_changed(id(radio_button_label), id(radio_manual) ? "Radio ON" : "Radio");
          const std::string station_texte = std::string("Station : ") + id(reveil_station_radio).current_option();
          set_label_if_changed(id(reveil_station_label), station_texte.c_str());
          set_label_if_changed(id(settings_title), id(selected_alarm) == 1 ? "Alarme 1" : "Alarme 2");
          snprintf(value, sizeof(value), "%02d", (int)(id(selected_alarm) == 1 ? id(alarm_one_hour).state : id(alarm_two_hour).state));
          set_label_if_changed(id(settings_hour), value);
          snprintf(value, sizeof(value), "%02d", (int)(id(selected_alarm) == 1 ? id(alarm_one_minute).state : id(alarm_two_minute).state));
          set_label_if_changed(id(settings_minute), value);
          snprintf(value, sizeof(value), "%d/10", id(selected_alarm) == 1 ? id(alarm_one_volume) : id(alarm_two_volume));
          set_label_if_changed(id(settings_volume), value);
          // Toujours rendre le volume visible lors de l'ouverture des deux alarmes.
          lv_obj_clear_flag(id(settings_volume), LV_OBJ_FLAG_HIDDEN);
          bool radio_choisie = id(selected_alarm) == 1 ? id(alarm_one_radio) : id(alarm_two_radio);
          lv_obj_set_style_bg_color(id(alarm_radio_button), lv_color_hex(radio_choisie ? 0x00AD22 : 0x304458), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(alarm_buzzer_button), lv_color_hex(!radio_choisie ? 0x00AD22 : 0x304458), LV_PART_MAIN);
          set_label_if_changed(id(alarm_test_label), id(alarm_test_active) ? "Arrêter le test" : "Tester");
          set_label_if_changed(id(preset_edit_label), id(preset_edit) ? "Annuler la modification" : "Modifier les préréglages");
          if (id(preset_edit) && id(preset_selected) >= 0) lv_obj_clear_flag(id(preset_save_button), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(preset_save_button), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_style_bg_color(id(preset_button_1), lv_color_hex(id(preset_edit) ? 0x075BA8 : 0x304458), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(preset_button_2), lv_color_hex(id(preset_edit) ? 0x075BA8 : 0x304458), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(preset_button_3), lv_color_hex(id(preset_edit) ? 0x075BA8 : 0x304458), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(preset_button_4), lv_color_hex(id(preset_edit) ? 0x075BA8 : 0x304458), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(preset_button_5), lv_color_hex(id(preset_edit) ? 0x075BA8 : 0x304458), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(preset_button_6), lv_color_hex(id(preset_edit) ? 0x075BA8 : 0x304458), LV_PART_MAIN);
          const int preset_minutes[] = {id(preset_1),id(preset_2),id(preset_3),id(preset_4),id(preset_5),id(preset_6)};
          lv_obj_t *preset_labels[] = {id(preset_label_1),id(preset_label_2),id(preset_label_3),id(preset_label_4),id(preset_label_5),id(preset_label_6)};
          for (int i = 0; i < 6; ++i) {
            char preset_text[16];
            snprintf(preset_text, sizeof(preset_text), "%02d:%02d", preset_minutes[i]/60, preset_minutes[i]%60);
            set_label_if_changed(preset_labels[i], preset_text);
          }
          snprintf(value, sizeof(value), "%02d:%02d", (int) id(alarm_one_hour).state, (int) id(alarm_one_minute).state);
          set_label_if_changed(id(alarm_one_time_label), value);
          snprintf(value, sizeof(value), "%02d:%02d", (int) id(alarm_two_hour).state, (int) id(alarm_two_minute).state);
          set_label_if_changed(id(alarm_two_time_label), value);
          if (id(alarm_ringing) && !id(active_alarm_radio) && !id(alarm_buzzer).is_playing()) {
            id(alarm_buzzer).set_gain((id(selected_alarm) == 1
              ? id(alarm_one_volume) : id(alarm_two_volume)) / 10.0f);
            id(alarm_buzzer).play("reveil:d=8,o=5,b=120:c6,p,c6,p,g5,p,g5,p");
          }
          // Le snooze utilise millis() : il doit fonctionner même si le Wi-Fi
          // et l'heure SNTP deviennent indisponibles après la première sonnerie.
          const bool snooze_due = id(snooze_pending) &&
            (int32_t)(millis() - id(snooze_deadline_ms)) >= 0;
          if (snooze_due && !id(alarm_ringing)) {
            id(snooze_pending) = false;
            id(start_alarm).execute();
          }
          // En mode manuel, réarmer dès que l'horloge quitte la minute
          // de la dernière sonnerie : le réveil se répète ainsi chaque jour.
          if (id(manual_clock) && clock_valid &&
              shown_hour * 60 + shown_minute != id(last_alarm_minute)) {
            id(last_alarm_minute) = -1;
          }
          if (clock_valid && !id(alarm_ringing) && !id(snooze_pending) && !snooze_due) {
            // En mode SNTP, l'horodatage absolu distingue les deux occurrences
            // de la même heure lors du passage à l'heure d'hiver.
            const int minute_key = id(manual_clock)
              ? (shown_hour * 60 + shown_minute) : (int)(t.timestamp / 60);
            const bool match_one = id(alarm_one_enabled).state &&
              shown_hour == (int) id(alarm_one_hour).state &&
              shown_minute == (int) id(alarm_one_minute).state &&
              (id(manual_clock) || (int64_t)(t.timestamp / 60) != id(alarm_one_last_epoch_minute));
            const bool match_two = id(alarm_two_enabled).state &&
              shown_hour == (int) id(alarm_two_hour).state &&
              shown_minute == (int) id(alarm_two_minute).state &&
              (id(manual_clock) || (int64_t)(t.timestamp / 60) != id(alarm_two_last_epoch_minute));
            if (minute_key != id(last_alarm_minute) && (match_one || match_two)) {
              if (!id(manual_clock)) {
                if (match_one) id(alarm_one_last_epoch_minute) = (int64_t)(t.timestamp / 60);
                if (match_two) id(alarm_two_last_epoch_minute) = (int64_t)(t.timestamp / 60);
              }
              id(last_alarm_minute) = minute_key;
              // Deux alarmes à la même minute : Réveil 1 sonne en premier,
              // Réveil 2 attend l'arrêt explicite de la première sonnerie.
              id(alarm_two_queued) = match_one && match_two;
              id(selected_alarm) = match_one ? 1 : 2;
              id(active_alarm_radio) = id(selected_alarm) == 1
                ? id(alarm_one_radio) : id(alarm_two_radio);
              id(start_alarm).execute();
            }
          }
