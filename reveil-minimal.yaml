              - lambda: |-
                  if (!id(preset_edit)) {
                    id(preset_original_hour) = (int)(id(selected_alarm) == 1 ? id(alarm_one_hour).state : id(alarm_two_hour).state);
                    id(preset_original_minute) = (int)(id(selected_alarm) == 1 ? id(alarm_one_minute).state : id(alarm_two_minute).state);
                    id(preset_edit) = true;
                  } else {
                    auto &h = id(selected_alarm) == 1 ? id(alarm_one_hour) : id(alarm_two_hour);
                    auto &m = id(selected_alarm) == 1 ? id(alarm_one_minute) : id(alarm_two_minute);
                    auto hc = h->make_call(); hc.set_value(id(preset_original_hour)); hc.perform();
                    auto mc = m->make_call(); mc.set_value(id(preset_original_minute)); mc.perform();
                    id(preset_edit) = false;
                  }
                  id(preset_selected) = -1;
