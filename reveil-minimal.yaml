interval:
  - interval: 1s
    then:
      - lambda: |-
          auto t = id(clock_time).now();
          if (t.is_valid()) {
            const uint8_t map[10] = {0x3F, 0x06, 0x5B, 0x4F, 0x66, 0x6D, 0x7D, 0x07, 0x7F, 0x6F};
            int digits[4] = {t.hour / 10, t.hour % 10, t.minute / 10, t.minute % 10};
            lv_obj_set_style_bg_color(id(digit_0_0), lv_color_hex((map[digits[0]] & (1 << 0)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_0_1), lv_color_hex((map[digits[0]] & (1 << 1)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_0_2), lv_color_hex((map[digits[0]] & (1 << 2)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_0_3), lv_color_hex((map[digits[0]] & (1 << 3)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_0_4), lv_color_hex((map[digits[0]] & (1 << 4)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_0_5), lv_color_hex((map[digits[0]] & (1 << 5)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_0_6), lv_color_hex((map[digits[0]] & (1 << 6)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_1_0), lv_color_hex((map[digits[1]] & (1 << 0)) ? 0xB5E8F4 : 0x000000), LV_PART_MAIN);
