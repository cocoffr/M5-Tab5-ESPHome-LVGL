# Firmware autonome expérimental ST7121 — sans l'application domotique.
# Point d'entrée séparé : ne modifie pas tab5-ha-hmi.yaml.
substitutions:
  device_name: reveil-tab5
esphome:
  name: ${device_name}
  friendly_name: Reveil Tab5
esp32:
  board: esp32-p4-evboard
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
psram:
  mode: hex
  speed: 200MHz
logger:
api:
ota:
  - platform: esphome
esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  slot: 1
  sdio_frequency: 20MHz
  use_psram: true
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
time:
  - platform: sntp
    id: clock_time
    timezone: Europe/Paris
i2c:
  sda: GPIO31
  scl: GPIO32
  frequency: 400kHz
pi4ioe5v6408:
  - id: ioexp
    address: 0x43
esp_ldo:
  - voltage: 2.5V
    channel: 3
display:
  - platform: mipi_dsi
    id: screen
    model: M5STACK-TAB5-ST7121
    dimensions:
      width: 720
      height: 1280
    reset_pin:
      pi4ioe5v6408: ioexp
      number: 4
    pixel_mode: 16bit
    color_order: RGB
    update_interval: never
    auto_clear_enabled: false
touchscreen:
  - platform: st7123
    id: touch
    interrupt_pin: GPIO23
    reset_pin:
      pi4ioe5v6408: ioexp
      number: 5
    calibration:
      x_min: 0
      x_max: 720
      y_min: 0
      y_max: 1280
output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO22
    frequency: 1000Hz
light:
  - platform: monochromatic
    id: backlight
    name: Luminosite
    output: backlight_pwm
    restore_mode: RESTORE_DEFAULT_ON
    initial_state:
      brightness: 70%
datetime:
  - platform: template
    id: alarm_one_time
    name: Alarme 1 heure
    type: time
    optimistic: true
    initial_value: "07:00:00"
    restore_value: true
  - platform: template
    id: alarm_two_time
    name: Alarme 2 heure
    type: time
    optimistic: true
    initial_value: "07:30:00"
    restore_value: true
switch:
  - platform: template
    id: alarm_one_enabled
    name: Alarme 1
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: alarm_two_enabled
    name: Alarme 2
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
# Réglages locaux indépendants de Home Assistant.
number:
  - platform: template
    id: brightness_level
    name: Luminosite 1 a 10
    min_value: 1
    max_value: 10
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 7
    set_action:
      - light.turn_on:
          id: backlight
          brightness: !lambda 'return x / 10.0f;'
  - platform: template
    id: volume_level
    name: Volume 1 a 10
    min_value: 1
    max_value: 10
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 5
  - platform: template
    id: alarm_one_hour
    name: Alarme 1 heures
    min_value: 0
    max_value: 23
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 7
  - platform: template
    id: alarm_one_minute
    name: Alarme 1 minutes
    min_value: 0
    max_value: 59
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 0
  - platform: template
    id: alarm_two_hour
    name: Alarme 2 heures
    min_value: 0
    max_value: 23
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 7
  - platform: template
    id: alarm_two_minute
    name: Alarme 2 minutes
    min_value: 0
    max_value: 59
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 30
# Sortie audio locale du Tab5 (ES8388 + I2S).
i2s_audio:
  - id: audio_bus
    i2s_lrclk_pin: GPIO29
    i2s_bclk_pin: GPIO27
    i2s_mclk_pin: GPIO30
audio_dac:
  - platform: es8388
    id: alarm_dac
speaker:
  - platform: i2s_audio
    id: alarm_speaker
    i2s_dout_pin: GPIO26
    audio_dac: alarm_dac
    dac_type: external
    channel: stereo
    sample_rate: 48000
    bits_per_sample: 16bit
    buffer_duration: 2000ms
media_player:
  - platform: speaker
    id: radio_player
    name: Radio Reveil
    media_pipeline:
      speaker: alarm_speaker
      format: MP3
    volume_min: 0.05
    volume_max: 1.0
globals:
  - id: last_alarm_minute
    type: int
    restore_value: no
    initial_value: '-1'
  - id: snooze_until
    type: int
    restore_value: no
    initial_value: '-1'
  - id: alarm_ringing
    type: bool
    restore_value: no
    initial_value: 'false'
script:
  - id: start_alarm
    then:
      - lambda: 'id(alarm_ringing) = true;'
      - media_player.volume_set:
          id: radio_player
          volume: !lambda 'return id(volume_level).state / 10.0f;'
      - media_player.play_media:
          id: radio_player
          media_url: "https://scdn.nrjaudio.fm/adwz2/fr/30283/mp3_128.mp3"
  - id: stop_alarm
    then:
      - lambda: 'id(alarm_ringing) = false;'
      - media_player.stop: radio_player
  - id: snooze_alarm
    then:
      - lambda: |-
          if (id(alarm_ringing)) {
            auto t = id(clock_time).now();
            if (t.is_valid()) id(snooze_until) = (int)(t.timestamp / 60) + 9;
            id(alarm_ringing) = false;
          }
      - media_player.stop: radio_player
font:
  - file: "gfonts://Roboto"
    id: clock_font
    size: 260
    glyphs: "0123456789:"
  - file: "gfonts://Roboto"
    id: label_font
    size: 32
    glyphs: "0123456789: /ONFALRM+-VUSZE"
lvgl:
  displays:
    - screen
  touchscreens:
    - touch
  rotation: 270
  pages:
    - id: reveil_page
      bg_color: 0x101820
      widgets:
        - label:
            id: clock_label
            text: "--:--"
            align: TOP_MID
            y: 90
            text_color: 0xFFFFFF
            text_font: clock_font
        - button:
            x: 30
            y: 520
            width: 580
            height: 80
            bg_color: 0x30383E
            on_click:
              - switch.toggle: alarm_one_enabled
            widgets:
              - label:
                  id: alarm_one_label
                  text: "ALARME 1 OFF"
                  align: CENTER
                  text_font: label_font
        - button:
            x: 650
            y: 520
            width: 580
            height: 80
            bg_color: 0x30383E
            on_click:
              - switch.toggle: alarm_two_enabled
            widgets:
              - label:
                  id: alarm_two_label
                  text: "ALARME 2 OFF"
                  align: CENTER
                  text_font: label_font
        - label:
            id: brightness_label
            text: "L 7"
            x: 60
            y: 640
            text_font: label_font
            text_color: 0xFFFFFF
        - button:
            x: 170
            y: 625
            width: 90
            height: 70
            on_click:
              - number.decrement: brightness_level
            widgets:
              - label:
                  text: "-"
                  align: CENTER
                  text_font: label_font
        - button:
            x: 275
            y: 625
            width: 90
            height: 70
            on_click:
              - number.increment: brightness_level
            widgets:
              - label:
                  text: "+"
                  align: CENTER
                  text_font: label_font
        - label:
            id: volume_label
            text: "V 5"
            x: 700
            y: 640
            text_font: label_font
            text_color: 0xFFFFFF
        - button:
            x: 810
            y: 625
            width: 90
            height: 70
            on_click:
              - number.decrement: volume_level
            widgets:
              - label:
                  text: "-"
                  align: CENTER
                  text_font: label_font
        - button:
            x: 915
            y: 625
            width: 90
            height: 70
            on_click:
              - number.increment: volume_level
            widgets:
              - label:
                  text: "+"
                  align: CENTER
                  text_font: label_font
        - label:
            id: alarm_one_time_label
            text: "07:00"
            x: 200
            y: 465
            text_color: 0xFFFFFF
            text_font: label_font
        - button:
            x: 30
            y: 405
            width: 110
            height: 52
            bg_color: 0x30383E
            on_click:
              - number.decrement: alarm_one_hour
            widgets:
              - label:
                  text: "-"
                  align: CENTER
                  text_font: label_font
        - button:
            x: 155
            y: 405
            width: 110
            height: 52
            bg_color: 0x30383E
            on_click:
              - number.increment: alarm_one_hour
            widgets:
              - label:
                  text: "+"
                  align: CENTER
                  text_font: label_font
        - button:
            x: 280
            y: 405
            width: 110
            height: 52
            bg_color: 0x30383E
            on_click:
              - number.decrement: alarm_one_minute
            widgets:
              - label:
                  text: "-"
                  align: CENTER
                  text_font: label_font
        - button:
            x: 405
            y: 405
            width: 110
            height: 52
            bg_color: 0x30383E
            on_click:
              - number.increment: alarm_one_minute
            widgets:
              - label:
                  text: "+"
                  align: CENTER
                  text_font: label_font
        - label:
            id: alarm_two_time_label
            text: "07:30"
            x: 820
            y: 465
            text_color: 0xFFFFFF
            text_font: label_font
        - button:
            x: 650
            y: 405
            width: 110
            height: 52
            bg_color: 0x30383E
            on_click:
              - number.decrement: alarm_two_hour
            widgets:
              - label:
                  text: "-"
                  align: CENTER
                  text_font: label_font
        - button:
            x: 775
            y: 405
            width: 110
            height: 52
            bg_color: 0x30383E
            on_click:
              - number.increment: alarm_two_hour
            widgets:
              - label:
                  text: "+"
                  align: CENTER
                  text_font: label_font
        - button:
            x: 900
            y: 405
            width: 110
            height: 52
            bg_color: 0x30383E
            on_click:
              - number.decrement: alarm_two_minute
            widgets:
              - label:
                  text: "-"
                  align: CENTER
                  text_font: label_font
        - button:
            x: 1025
            y: 405
            width: 110
            height: 52
            bg_color: 0x30383E
            on_click:
              - number.increment: alarm_two_minute
            widgets:
              - label:
                  text: "+"
                  align: CENTER
                  text_font: label_font
        - button:
            x: 1050
            y: 625
            width: 180
            height: 70
            bg_color: 0x30383E
            on_click:
              - script.execute: snooze_alarm
            widgets:
              - label:
                  text: "SNOOZE"
                  align: CENTER
                  text_font: label_font
interval:
  - interval: 1s
    then:
      - lambda: |-
          auto t = id(clock_time).now();
          if (t.is_valid()) {
            char time_text[8];
            snprintf(time_text, sizeof(time_text), "%02d:%02d", t.hour, t.minute);
            lv_label_set_text(id(clock_label), time_text);
          }
          lv_label_set_text(id(alarm_one_label), id(alarm_one_enabled).state ? "ALARME 1 ON" : "ALARME 1 OFF");
          lv_label_set_text(id(alarm_two_label), id(alarm_two_enabled).state ? "ALARME 2 ON" : "ALARME 2 OFF");
          char value[16];
          snprintf(value, sizeof(value), "L %.0f", id(brightness_level).state);
          lv_label_set_text(id(brightness_label), value);
          snprintf(value, sizeof(value), "V %.0f", id(volume_level).state);
          lv_label_set_text(id(volume_label), value);
          snprintf(value, sizeof(value), "%02d:%02d", (int) id(alarm_one_hour).state, (int) id(alarm_one_minute).state);
          lv_label_set_text(id(alarm_one_time_label), value);
          snprintf(value, sizeof(value), "%02d:%02d", (int) id(alarm_two_hour).state, (int) id(alarm_two_minute).state);
          lv_label_set_text(id(alarm_two_time_label), value);
          if (t.is_valid()) {
            int minute_key = (int)(t.timestamp / 60);
            bool match_one = id(alarm_one_enabled).state && t.hour == (int) id(alarm_one_hour).state && t.minute == (int) id(alarm_one_minute).state;
            bool match_two = id(alarm_two_enabled).state && t.hour == (int) id(alarm_two_hour).state && t.minute == (int) id(alarm_two_minute).state;
            if (minute_key != id(last_alarm_minute) && (match_one || match_two || minute_key == id(snooze_until))) {
              id(last_alarm_minute) = minute_key;
              id(snooze_until) = -1;
              id(start_alarm).execute();
            }
          }
