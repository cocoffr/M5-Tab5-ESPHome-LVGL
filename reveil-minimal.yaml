script:
  - id: open_settings
    then:
      - lvgl.page.show: reveil_settings_page
  - id: open_clock_settings
    then:
      - lvgl.page.show: clock_settings_page
  - id: manual_clock_adjust_hour
    parameters:
      delta: int
    then:
      - lambda: |-
          id(manual_hour) = (id(manual_hour) + delta + 24) % 24;
          id(manual_last_tick) = millis();
  - id: manual_clock_adjust_minute
    parameters:
      delta: int
    then:
      - lambda: |-
          id(manual_minute) = (id(manual_minute) + delta + 60) % 60;
          id(manual_last_tick) = millis();
  - id: set_manual_clock
    then:
      - lambda: |-
          if (!id(manual_clock)) {
            auto t = id(clock_time).now();
            if (t.is_valid()) { id(manual_hour) = t.hour; id(manual_minute) = t.minute; }
          }
          id(manual_clock) = true;
          id(manual_last_tick) = millis();
          id(last_alarm_minute) = -1;
  - id: set_auto_clock
    then:
      - lambda: |-
          id(manual_clock) = false;
          id(last_alarm_minute) = -1;
  - id: play_selected_radio
    then:
      - mqtt.publish:
          topic: reveil-tab5/radio/test/diagnostic
          payload: !lambda |-
            const std::string urls[] = {id(radio_url_1).state,id(radio_url_2).state,id(radio_url_3).state,id(radio_url_4).state,id(radio_url_5).state,id(radio_url_6).state,id(radio_url_7).state,id(radio_url_8).state,id(radio_url_9).state,id(radio_url_10).state,id(radio_url_11).state,id(radio_url_12).state};
            const int slot = id(radio_slot);
            if (slot < 0 || slot >= 12) return std::string("Emplacement invalide");
            const std::string &url = urls[slot];
            char prefix[64];
            snprintf(prefix,sizeof(prefix),"Station %d : ",slot+1);
            return std::string(prefix) + ((url.rfind("http://",0)==0 || url.rfind("https://",0)==0) ? "lecture demandée " : "URL absente/invalide ") + url;
          retain: false
      - if:
          condition:
            lambda: |-
              const std::string urls[] = {id(radio_url_1).state, id(radio_url_2).state, id(radio_url_3).state, id(radio_url_4).state, id(radio_url_5).state, id(radio_url_6).state, id(radio_url_7).state, id(radio_url_8).state, id(radio_url_9).state, id(radio_url_10).state, id(radio_url_11).state, id(radio_url_12).state};
              if (id(radio_slot) < 0 || id(radio_slot) >= 12) return false;
              const auto &url = urls[id(radio_slot)];
              return url.rfind("http://", 0) == 0 || url.rfind("https://", 0) == 0;
          then:
            - media_player.play_media:
                id: radio_player
                media_url: !lambda |-
                  const std::string urls[] = {id(radio_url_1).state, id(radio_url_2).state, id(radio_url_3).state, id(radio_url_4).state, id(radio_url_5).state, id(radio_url_6).state, id(radio_url_7).state, id(radio_url_8).state, id(radio_url_9).state, id(radio_url_10).state, id(radio_url_11).state, id(radio_url_12).state};
                  int slot = id(radio_slot);
                  return slot >= 0 && slot < 12 ? urls[slot] : std::string("");
                announcement: false
  - id: select_radio_slot
    parameters:
      slot: int
    then:
      - lambda: 'id(radio_slot) = slot;'
      - mqtt.publish:
          topic: reveil-tab5/radio/station
          payload: !lambda |-
            const std::string names[] = {id(radio_name_1).state, id(radio_name_2).state, id(radio_name_3).state, id(radio_name_4).state, id(radio_name_5).state, id(radio_name_6).state, id(radio_name_7).state, id(radio_name_8).state, id(radio_name_9).state, id(radio_name_10).state, id(radio_name_11).state, id(radio_name_12).state};
            return names[id(radio_slot)];
          retain: true
      - media_player.stop: radio_player
      - delay: 200ms
      - media_player.volume_set:
          id: radio_player
          volume: !lambda 'return id(volume_level).state / 10.0f;'
      - script.execute: play_selected_radio
      - lambda: 'id(radio_manual) = true;'
      - lvgl.page.show: reveil_page
  - id: next_radio_station
    then:
      - lambda: 'id(radio_slot) = (id(radio_slot) + 1) % 12;'
      - if:
          condition:
            lambda: 'return id(radio_manual) && !id(alarm_ringing);'
          then:
            - media_player.stop: radio_player
            - delay: 200ms
            - script.execute: play_selected_radio
  - id: edit_radio_slot
    parameters:
      slot: int
    then:
      - lambda: |-
          id(radio_edit_slot) = slot;
          const std::string names[] = {id(radio_name_1).state, id(radio_name_2).state, id(radio_name_3).state, id(radio_name_4).state, id(radio_name_5).state, id(radio_name_6).state, id(radio_name_7).state, id(radio_name_8).state, id(radio_name_9).state, id(radio_name_10).state, id(radio_name_11).state, id(radio_name_12).state};
          const std::string urls[] = {id(radio_url_1).state, id(radio_url_2).state, id(radio_url_3).state, id(radio_url_4).state, id(radio_url_5).state, id(radio_url_6).state, id(radio_url_7).state, id(radio_url_8).state, id(radio_url_9).state, id(radio_url_10).state, id(radio_url_11).state, id(radio_url_12).state};
          lv_textarea_set_text(id(radio_name_input), names[slot].c_str());
          lv_textarea_set_text(id(radio_url_input), urls[slot].c_str());
      - lvgl.page.show: reveil_radio_edit_page
  - id: publish_radio_favorites
    then:
      - lambda: |-
          const std::string names[] = {id(radio_name_1).state,id(radio_name_2).state,id(radio_name_3).state,id(radio_name_4).state,id(radio_name_5).state,id(radio_name_6).state,id(radio_name_7).state,id(radio_name_8).state,id(radio_name_9).state,id(radio_name_10).state,id(radio_name_11).state,id(radio_name_12).state};
          const std::string urls[] = {id(radio_url_1).state,id(radio_url_2).state,id(radio_url_3).state,id(radio_url_4).state,id(radio_url_5).state,id(radio_url_6).state,id(radio_url_7).state,id(radio_url_8).state,id(radio_url_9).state,id(radio_url_10).state,id(radio_url_11).state,id(radio_url_12).state};
          for (int i=0;i<12;i++) {
            char topic[64]; snprintf(topic,sizeof(topic),"reveil-tab5/radio/favori/%d",i+1);
            std::string payload;
            payload = json::build_json([&](JsonObject root) { root["slot"]=i+1; root["name"]=names[i]; root["url"]=urls[i]; });
            id(mqtt_client).publish(topic,payload,0,true);
          }
  - id: save_radio_slot
    then:
      - lambda: |-
          const int slot = id(radio_edit_slot);
          const std::string name = lv_textarea_get_text(id(radio_name_input));
          const std::string url = lv_textarea_get_text(id(radio_url_input));
          if (name.empty() || (url.rfind("https://",0) != 0 && url.rfind("http://",0) != 0)) return;
          if (slot == 0) { auto n = id(radio_name_1).make_call(); n.set_value(name); n.perform(); auto u = id(radio_url_1).make_call(); u.set_value(url); u.perform(); }
          if (slot == 1) { auto n = id(radio_name_2).make_call(); n.set_value(name); n.perform(); auto u = id(radio_url_2).make_call(); u.set_value(url); u.perform(); }
          if (slot == 2) { auto n = id(radio_name_3).make_call(); n.set_value(name); n.perform(); auto u = id(radio_url_3).make_call(); u.set_value(url); u.perform(); }
          if (slot == 3) { auto n = id(radio_name_4).make_call(); n.set_value(name); n.perform(); auto u = id(radio_url_4).make_call(); u.set_value(url); u.perform(); }
          if (slot == 4) { auto n = id(radio_name_5).make_call(); n.set_value(name); n.perform(); auto u = id(radio_url_5).make_call(); u.set_value(url); u.perform(); }
          if (slot == 5) { auto n = id(radio_name_6).make_call(); n.set_value(name); n.perform(); auto u = id(radio_url_6).make_call(); u.set_value(url); u.perform(); }
          if (slot == 6) { auto n = id(radio_name_7).make_call(); n.set_value(name); n.perform(); auto u = id(radio_url_7).make_call(); u.set_value(url); u.perform(); }
          if (slot == 7) { auto n = id(radio_name_8).make_call(); n.set_value(name); n.perform(); auto u = id(radio_url_8).make_call(); u.set_value(url); u.perform(); }
          if (slot == 8) { auto n = id(radio_name_9).make_call(); n.set_value(name); n.perform(); auto u = id(radio_url_9).make_call(); u.set_value(url); u.perform(); }
          if (slot == 9) { auto n = id(radio_name_10).make_call(); n.set_value(name); n.perform(); auto u = id(radio_url_10).make_call(); u.set_value(url); u.perform(); }
          if (slot == 10) { auto n = id(radio_name_11).make_call(); n.set_value(name); n.perform(); auto u = id(radio_url_11).make_call(); u.set_value(url); u.perform(); }
          if (slot == 11) { auto n = id(radio_name_12).make_call(); n.set_value(name); n.perform(); auto u = id(radio_url_12).make_call(); u.set_value(url); u.perform(); }
      - script.execute: publish_radio_favorites
      - lvgl.page.show: reveil_radio_page
      - lambda: 'id(radio_long_press_handled) = false;'
  - id: toggle_radio
    then:
      - if:
          condition:
            lambda: 'return id(radio_manual);'
          then:
            - lambda: 'id(radio_manual) = false;'
            - media_player.stop: radio_player
            - mqtt.publish:
                topic: reveil-tab5/radio/etat
                payload: "OFF"
                retain: true
          else:
            - lambda: 'id(radio_manual) = true;'
            - mqtt.publish:
                topic: reveil-tab5/radio/etat
                payload: "ON"
                retain: true
            - mqtt.publish:
                topic: reveil-tab5/radio/station
                payload: !lambda 'return id(reveil_station_radio).current_option();'
                retain: true
            - media_player.volume_set:
                id: radio_player
                volume: !lambda 'return id(volume_level).state / 10.0f;'
            - script.execute: play_selected_radio
  - id: start_alarm
    then:
      - lambda: 'id(alarm_ringing) = true; id(radio_manual) = false;'
      - lvgl.page.show: reveil_page
      - if:
          condition:
            lambda: 'return id(active_alarm_radio);'
          then:
            - media_player.volume_set:
                id: radio_player
                volume: !lambda 'return (id(selected_alarm) == 1 ? id(alarm_one_volume) : id(alarm_two_volume)) / 10.0f;'
            - script.execute: play_selected_radio
          else:
            - lambda: |-
                id(alarm_buzzer).set_gain((id(selected_alarm) == 1
                  ? id(alarm_one_volume) : id(alarm_two_volume)) / 10.0f);
            - rtttl.play:
                id: alarm_buzzer
                rtttl: "reveil:d=8,o=5,b=120:c6,p,c6,p,g5,p,g5,p"
  - id: stop_alarm
    then:
      - lambda: 'id(alarm_ringing) = false; id(snooze_pending) = false; id(radio_manual) = false;'
      - rtttl.stop:
          id: alarm_buzzer
      - media_player.stop: radio_player
      - lvgl.page.show: reveil_page
      - if:
          condition:
            lambda: 'return id(alarm_two_queued) && id(alarm_two_enabled).state;'
          then:
            - lambda: |-
                id(alarm_two_queued) = false;
                id(selected_alarm) = 2;
                id(active_alarm_radio) = id(alarm_two_radio);
            - script.execute: start_alarm
  - id: snooze_alarm
    then:
      - lambda: |-
          if (id(alarm_ringing)) {
            // Compte à rebours monotone : reste fiable si l'heure est corrigée.
            id(snooze_deadline_ms) = millis() + 9UL * 60000UL;
            id(snooze_pending) = true;
            id(alarm_ringing) = false;
          }
      - rtttl.stop:
          id: alarm_buzzer
      - media_player.stop: radio_player
      - lvgl.page.show: reveil_page
  - id: stop_alarm_test
    then:
      - lambda: 'id(alarm_test_active) = false;'
      - rtttl.stop:
          id: alarm_buzzer
      - media_player.stop: radio_player
  - id: test_alarm
    then:
      - if:
          condition:
            lambda: 'return id(alarm_test_active);'
          then:
            - script.execute: stop_alarm_test
          else:
            - lambda: 'id(alarm_test_active) = true;'
            - if:
                condition:
                  lambda: 'return id(selected_alarm) == 1 ? id(alarm_one_radio) : id(alarm_two_radio);'
                then:
                  - media_player.volume_set:
                      id: radio_player
                      volume: !lambda 'return (id(selected_alarm) == 1 ? id(alarm_one_volume) : id(alarm_two_volume)) / 10.0f;'
                  - script.execute: play_selected_radio
                else:
                  - lambda: |-
                      id(alarm_buzzer).set_gain((id(selected_alarm) == 1
                        ? id(alarm_one_volume) : id(alarm_two_volume)) / 10.0f);
                  - rtttl.play:
                      id: alarm_buzzer
                      rtttl: "reveil:d=8,o=5,b=120:c6,p,c6,p,g5,p,g5,p"
  - id: select_preset
    parameters:
      slot: int
    then:
      - lambda: |-
          if (slot < 0 || slot >= 6) return;
          id(preset_selected) = slot;
          // Charger l'horaire existant, sans modifier la valeur mémorisée.
          // L'enregistrement est exclusivement effectué par save_preset.
          int *p[] = {&id(preset_1), &id(preset_2), &id(preset_3), &id(preset_4), &id(preset_5), &id(preset_6)};
          const int minutes = *p[slot];
          auto &h = id(selected_alarm) == 1 ? id(alarm_one_hour) : id(alarm_two_hour);
          auto &m = id(selected_alarm) == 1 ? id(alarm_one_minute) : id(alarm_two_minute);
          auto hc = h->make_call(); hc.set_value(minutes / 60); hc.perform();
          auto mc = m->make_call(); mc.set_value(minutes % 60); mc.perform();
  - id: save_preset
    then:
      - lambda: |-
          const int minutes = (int)(id(selected_alarm) == 1 ? id(alarm_one_hour).state : id(alarm_two_hour).state) * 60
            + (int)(id(selected_alarm) == 1 ? id(alarm_one_minute).state : id(alarm_two_minute).state);
          int *p[] = {&id(preset_1), &id(preset_2), &id(preset_3), &id(preset_4), &id(preset_5), &id(preset_6)};
          if (!id(preset_edit) || id(preset_selected) < 0 || id(preset_selected) >= 6) return;
          *p[id(preset_selected)] = minutes;
          id(preset_edit) = false;
  - id: open_alarm_one
    then:
      - lambda: 'id(selected_alarm) = 1; id(preset_edit) = false; id(preset_selected) = -1;'
      - lvgl.page.show: alarm_settings_page
  - id: open_alarm_two
    then:
      - lambda: 'id(selected_alarm) = 2; id(preset_edit) = false; id(preset_selected) = -1;'
      - lvgl.page.show: alarm_settings_page
  - id: adjust_alarm_hour
    parameters:
      delta: int
    then:
      - lambda: |-
          auto &n = id(selected_alarm) == 1 ? id(alarm_one_hour) : id(alarm_two_hour);
          auto call = n->make_call();
          call.set_value(((int)n->state + delta + 24) % 24);
          call.perform();
  - id: adjust_alarm_minute
    parameters:
      delta: int
    then:
      - lambda: |-
          auto &n = id(selected_alarm) == 1 ? id(alarm_one_minute) : id(alarm_two_minute);
          auto call = n->make_call();
          call.set_value(((int)n->state + delta + 60) % 60);
          call.perform();
  - id: adjust_alarm_volume
    parameters:
      delta: int
    then:
      - lambda: |-
          int &v = id(selected_alarm) == 1 ? id(alarm_one_volume) : id(alarm_two_volume);
          v = std::max(1, std::min(10, v + delta));
  - id: select_alarm_buzzer
    then:
      - lambda: |-
          if (id(selected_alarm) == 1) id(alarm_one_radio) = false;
          else id(alarm_two_radio) = false;
  - id: select_alarm_radio
    then:
      - lambda: |-
          if (id(selected_alarm) == 1) id(alarm_one_radio) = true;
          else id(alarm_two_radio) = true;

rtttl:
  id: alarm_buzzer
  # Comme dans tab5-alarm.yaml d'origine, RTTTL pilote directement
  # le haut-parleur I2S/ES8388, sans mixer interposé.
  speaker: alarm_speaker
  gain: 100%
font:
  - file: "Tab5/fonts/materialdesignicons-webfont.ttf"
    id: status_icon_font
