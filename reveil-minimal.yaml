interval:
  - interval: 1s
    then:
      - lambda: |-
          auto t = id(clock_time).now();
          // Evite de redessiner les labels LVGL dont le texte n'a pas changé.
          auto set_label_if_changed = [](lv_obj_t *label, const char *value) {
            if (strcmp(lv_label_get_text(label), value) != 0) lv_label_set_text(label, value);
          };
          // En l'absence de synchronisation SNTP, afficher l'heure locale
          // mémorisée plutôt qu'un écran d'horloge vide.
          const bool offline_clock = !id(manual_clock) && !t.is_valid();
          if (id(manual_clock) || offline_clock) {
            uint32_t now_ms = millis();
            if (id(manual_last_tick) == 0) id(manual_last_tick) = now_ms;
            while ((uint32_t)(now_ms - id(manual_last_tick)) >= 60000UL) {
              id(manual_last_tick) += 60000UL;
              if (++id(manual_minute) >= 60) { id(manual_minute) = 0; id(manual_hour) = (id(manual_hour) + 1) % 24; }
            }
          }
          const bool clock_valid = true;
          const int shown_hour = (id(manual_clock) || offline_clock) ? id(manual_hour) : t.hour;
          const int shown_minute = (id(manual_clock) || offline_clock) ? id(manual_minute) : t.minute;
          // Apparence sauvegardée : police, échelle et couleur de l'heure.
          const std::string saved_font = id(appearance_font).current_option();
          const std::string font_choice = (saved_font == "Roboto" || saved_font == "Montserrat" || saved_font == "Oswald" || saved_font == "Orbitron" || saved_font == "Rajdhani") ? saved_font : "Segments";
          const std::string size_choice = id(appearance_size).current_option();
          const std::string color_choice = id(appearance_color).current_option();
          const char *color_names[] = {"Bleu clair","Bleu foncé","Blanc","Bleu ciel","Bleu roi","Bleu nuit","Bleu glacier","Cyan","Turquoise","Vert menthe","Vert","Vert foncé","Vert citron","Jaune","Or","Orange","Corail","Rouge","Bordeaux","Rose","Fuchsia","Violet","Mauve","Lavande","Gris perle","Gris clair","Gris moyen","Gris ardoise","Gris foncé","Beige"};
          const uint32_t color_values[] = {0xB5E8F4,0x287BB9,0xFFFFFF,0x55BDF5,0x2266EE,0x233D8B,0x92D6FF,0x00D8EF,0x00C6B4,0x73E7C2,0x31CF60,0x16864A,0xB2ED4A,0xFFE44A,0xEFC044,0xFF9638,0xFF7461,0xF34854,0xA73750,0xFF8BC7,0xE34AD8,0xB08AFF,0x9270C9,0xC6B4FF,0xD7DFE5,0xB4BDC7,0x88939F,0x647587,0x4C5866,0xE9D3B0};
          uint32_t clock_color = 0xB5E8F4;
          int selected_color = 0;
          for (int ci = 0; ci < 30; ++ci) {
            if (color_choice == color_names[ci]) {
              clock_color = color_values[ci];
              selected_color = ci;
              break;
            }
          }
          lv_obj_t *color_buttons[] = {id(appearance_color_btn_0),id(appearance_color_btn_1),id(appearance_color_btn_2),id(appearance_color_btn_3),id(appearance_color_btn_4),id(appearance_color_btn_5),id(appearance_color_btn_6),id(appearance_color_btn_7),id(appearance_color_btn_8),id(appearance_color_btn_9),id(appearance_color_btn_10),id(appearance_color_btn_11),id(appearance_color_btn_12),id(appearance_color_btn_13),id(appearance_color_btn_14),id(appearance_color_btn_15),id(appearance_color_btn_16),id(appearance_color_btn_17),id(appearance_color_btn_18),id(appearance_color_btn_19),id(appearance_color_btn_20),id(appearance_color_btn_21),id(appearance_color_btn_22),id(appearance_color_btn_23),id(appearance_color_btn_24),id(appearance_color_btn_25),id(appearance_color_btn_26),id(appearance_color_btn_27),id(appearance_color_btn_28),id(appearance_color_btn_29)};
          static int previous_selected_color = -1;
          if (previous_selected_color != selected_color) {
            previous_selected_color = selected_color;
            for (int ci = 0; ci < 30; ++ci) {
              lv_obj_set_style_border_color(color_buttons[ci],
                lv_color_hex(ci == selected_color ? 0x007BFF : 0x36495B), LV_PART_MAIN);
              lv_obj_set_style_border_width(color_buttons[ci],
                ci == selected_color ? 5 : 2, LV_PART_MAIN);
            }
          }
          const int size_level = std::max(1, std::min(10, atoi(size_choice.c_str())));
          const int scale_pct = 45 + size_level * 5;
          lv_obj_t *font_buttons[] = {id(appearance_font_btn_0),id(appearance_font_btn_1),id(appearance_font_btn_2),id(appearance_font_btn_3),id(appearance_font_btn_4),id(appearance_font_btn_5)};
          const char *font_names[] = {"Segments","Roboto","Montserrat","Oswald","Orbitron","Rajdhani"};
          for (int i=0; i<6; ++i)
            lv_obj_set_style_bg_color(font_buttons[i], lv_color_hex(font_choice == font_names[i] ? 0x075BA8 : 0x304458), LV_PART_MAIN);
          lv_obj_t *size_buttons[] = {id(appearance_size_btn_0),id(appearance_size_btn_1),id(appearance_size_btn_2),id(appearance_size_btn_3),id(appearance_size_btn_4),id(appearance_size_btn_5),id(appearance_size_btn_6),id(appearance_size_btn_7),id(appearance_size_btn_8),id(appearance_size_btn_9)};
          for (int i=0; i<10; ++i)
            lv_obj_set_style_bg_color(size_buttons[i], lv_color_hex(size_level == i+1 ? 0x075BA8 : 0x304458), LV_PART_MAIN);
          // Aperçu instantané : une vraie police par choix et taille graduée.
          lv_obj_t *previews[] = {id(appearance_preview_segments),id(appearance_preview_roboto),id(appearance_preview_montserrat),id(appearance_preview_oswald),id(appearance_preview_orbitron),id(appearance_preview_rajdhani)};
          const char *preview_names[] = {"Segments","Roboto","Montserrat","Oswald","Orbitron","Rajdhani"};
          char appearance_preview_time[8];
          snprintf(appearance_preview_time, sizeof(appearance_preview_time), "%02d:%02d", shown_hour, shown_minute);
          for (int pi=0; pi<6; ++pi) {
            const bool active = font_choice == preview_names[pi];
            if (active) lv_obj_remove_flag(previews[pi], LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(previews[pi], LV_OBJ_FLAG_HIDDEN);
            if (active) {
              set_label_if_changed(previews[pi], appearance_preview_time);
              lv_obj_set_style_text_color(previews[pi], lv_color_hex(clock_color), LV_PART_MAIN);
              lv_obj_set_style_transform_zoom(previews[pi], 100 + size_level * 15, LV_PART_MAIN);
            }
          }
          lv_obj_t *segments[] = {
            id(digit_0_0),id(digit_0_1),id(digit_0_2),id(digit_0_3),id(digit_0_4),id(digit_0_5),id(digit_0_6),
            id(digit_1_0),id(digit_1_1),id(digit_1_2),id(digit_1_3),id(digit_1_4),id(digit_1_5),id(digit_1_6),
            id(digit_2_0),id(digit_2_1),id(digit_2_2),id(digit_2_3),id(digit_2_4),id(digit_2_5),id(digit_2_6),
            id(digit_3_0),id(digit_3_1),id(digit_3_2),id(digit_3_3),id(digit_3_4),id(digit_3_5),id(digit_3_6),
            id(clock_colon_top),id(clock_colon_bottom)
          };
          const bool show_segments = font_choice == "Segments";
          lv_obj_t *font_labels[] = {id(clock_roboto_label),id(clock_montserrat_label),id(clock_oswald_label),id(clock_orbitron_label),id(clock_rajdhani_label)};
          const char *font_options[] = {"Roboto","Montserrat","Oswald","Orbitron","Rajdhani"};
          lv_obj_t *visible = nullptr;
          for (int fi=0;fi<5;++fi) {
            if (!show_segments && font_choice == font_options[fi]) visible = font_labels[fi];
            else lv_obj_add_flag(font_labels[fi], LV_OBJ_FLAG_HIDDEN);
          }
          if (visible) {
            lv_obj_remove_flag(visible, LV_OBJ_FLAG_HIDDEN);
            char clock_text[8];
            snprintf(clock_text, sizeof(clock_text), "%02d:%02d", shown_hour, shown_minute);
            set_label_if_changed(visible, clock_valid ? clock_text : "--:--");
            lv_obj_set_style_text_color(visible, lv_color_hex(clock_color), LV_PART_MAIN);
          }
          static int previous_scale = -1;
          if (previous_scale != scale_pct) {
            previous_scale = scale_pct;
            // Redimensionner les 30 éléments autour du centre de l'horloge.
            for (int i = 0; i < 30; ++i) {
              lv_obj_t *o = segments[i];
              static lv_coord_t orig_x[30],orig_y[30],orig_w[30],orig_h[30];
              static bool initialized = false;
              if (!initialized) {
                for (int k = 0; k < 30; ++k) {
                  orig_x[k] = lv_obj_get_x(segments[k]);
                  orig_y[k] = lv_obj_get_y(segments[k]);
                  orig_w[k] = lv_obj_get_width(segments[k]);
                  orig_h[k] = lv_obj_get_height(segments[k]);
                }
                initialized = true;
              }
              lv_obj_set_pos(o, 640 + (orig_x[i] - 640) * scale_pct / 100,
                              275 + (orig_y[i] - 275) * scale_pct / 100);
              lv_obj_set_size(o, orig_w[i] * scale_pct / 100, orig_h[i] * scale_pct / 100);
            }
          }
          for (lv_obj_t *o : segments) {
            if (show_segments) lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          }
          static uint32_t last_clock_color = 0;
          const bool color_changed = last_clock_color != clock_color;
          last_clock_color = clock_color;
          static int last_drawn_minute = -1;
          static bool previous_segments_visible = false;
          if (color_changed || (show_segments && !previous_segments_visible)) last_drawn_minute = -1;
          previous_segments_visible = show_segments;
          const int current_drawn_minute = clock_valid ? shown_hour * 60 + shown_minute : -1;
          if (clock_valid && current_drawn_minute != last_drawn_minute) {
            last_drawn_minute = current_drawn_minute;
            const uint8_t map[10] = {0x3F, 0x06, 0x5B, 0x4F, 0x66, 0x6D, 0x7D, 0x07, 0x7F, 0x6F};
            int digits[4] = {shown_hour / 10, shown_hour % 10, shown_minute / 10, shown_minute % 10};
            // Masquer la dizaine des heures entre 00:00 et 09:59.
            const uint8_t first_hour_segments = shown_hour < 10 ? 0 : map[digits[0]];
            lv_obj_set_style_bg_color(id(digit_0_0), lv_color_hex((first_hour_segments & (1 << 0)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_0_1), lv_color_hex((first_hour_segments & (1 << 1)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_0_2), lv_color_hex((first_hour_segments & (1 << 2)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_0_3), lv_color_hex((first_hour_segments & (1 << 3)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_0_4), lv_color_hex((first_hour_segments & (1 << 4)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_0_5), lv_color_hex((first_hour_segments & (1 << 5)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_0_6), lv_color_hex((first_hour_segments & (1 << 6)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_1_0), lv_color_hex((map[digits[1]] & (1 << 0)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_1_1), lv_color_hex((map[digits[1]] & (1 << 1)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_1_2), lv_color_hex((map[digits[1]] & (1 << 2)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_1_3), lv_color_hex((map[digits[1]] & (1 << 3)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_1_4), lv_color_hex((map[digits[1]] & (1 << 4)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_1_5), lv_color_hex((map[digits[1]] & (1 << 5)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_1_6), lv_color_hex((map[digits[1]] & (1 << 6)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_2_0), lv_color_hex((map[digits[2]] & (1 << 0)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_2_1), lv_color_hex((map[digits[2]] & (1 << 1)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_2_2), lv_color_hex((map[digits[2]] & (1 << 2)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_2_3), lv_color_hex((map[digits[2]] & (1 << 3)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_2_4), lv_color_hex((map[digits[2]] & (1 << 4)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_2_5), lv_color_hex((map[digits[2]] & (1 << 5)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_2_6), lv_color_hex((map[digits[2]] & (1 << 6)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_3_0), lv_color_hex((map[digits[3]] & (1 << 0)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_3_1), lv_color_hex((map[digits[3]] & (1 << 1)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_3_2), lv_color_hex((map[digits[3]] & (1 << 2)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_3_3), lv_color_hex((map[digits[3]] & (1 << 3)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_3_4), lv_color_hex((map[digits[3]] & (1 << 4)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_3_5), lv_color_hex((map[digits[3]] & (1 << 5)) ? clock_color : 0x000000), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_3_6), lv_color_hex((map[digits[3]] & (1 << 6)) ? clock_color : 0x000000), LV_PART_MAIN);
          }
          static int last_drawn_day = -1;
          if (id(manual_clock) || offline_clock) {
            set_label_if_changed(id(date_label), offline_clock ? "Heure non synchronisée" : "Heure manuelle");
            last_drawn_day = -1;
          }
          if (!id(manual_clock) && t.is_valid() && t.day_of_year != last_drawn_day) {
            last_drawn_day = t.day_of_year;
            const char *jours[] = {"dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"};
            const char *mois[] = {"janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"};
            char date_text[64];
            snprintf(date_text, sizeof(date_text), "%s %d %s", jours[t.day_of_week - 1], t.day_of_month, mois[t.month - 1]);
            set_label_if_changed(id(date_label), date_text);
          }
          // Contrôleur de charge : calcul des décisions, sorties verrouillées en attente des essais matériels.
          // Boutons de sélection : vert = option active, bleu = autres choix.
          auto battery_choice = [&](lv_obj_t *button, bool active) {
            lv_obj_set_style_bg_color(button, lv_color_hex(active ? 0x00AD22 : 0x075BA8), LV_PART_MAIN);
          };
          const std::string charge_limit = id(reveil_charge_limit).current_option();
          battery_choice(id(batt_limit_100), charge_limit == "100 %");
          battery_choice(id(batt_limit_80), charge_limit == "80 %");
          const std::string charge_mode = id(reveil_charge_mode).current_option();
          battery_choice(id(batt_mode_normal), charge_mode == "Classique");
          battery_choice(id(batt_mode_fast), charge_mode == "Rapide");
          const std::string power_save = id(reveil_power_save).current_option();
          battery_choice(id(batt_eco_0), power_save == "Jamais");
          battery_choice(id(batt_eco_1), power_save == "Sur batterie");
          battery_choice(id(batt_eco_2), power_save == "Toujours");
          const std::string wifi_save = id(reveil_wifi_save).current_option();
          battery_choice(id(batt_wifi_0), wifi_save == "Jamais");
          battery_choice(id(batt_wifi_1), wifi_save == "Sur batterie");
          battery_choice(id(batt_wifi_2), wifi_save == "Toujours");
          battery_choice(id(batt_fitted_yes), id(reveil_battery_installed).state);
          battery_choice(id(batt_fitted_no), !id(reveil_battery_installed).state);
          // La présence déclarée seule ne suffit pas : chargeur coupé au démarrage.
          // Contrôleur d'origine : sonde initiale et protections conservées.
          static EtatChargeur controle_charge;
          static bool controle_initialise = false;
          if (!controle_initialise) {
            // Comme le journal de démarrage original : ne pas réveiller une
            // batterie après watchdog, panique ou chute de tension.
            const esp_reset_reason_t cause = esp_reset_reason();
            const bool demarrage_anormal =
              cause != ESP_RST_POWERON && cause != ESP_RST_SW &&
              cause != ESP_RST_DEEPSLEEP;
            chargeur_demarrer(controle_charge, id(reveil_battery_memory),
              id(reveil_battery_installed).state, demarrage_anormal,
              id(reveil_charge_thermal_latch), millis());
            controle_initialise = true;
          }
          // Les valeurs INA226 sont publiées toutes les 15 s : ne pas traiter
          // 15 fois la même lecture comme autant de nouvelles mesures.
          const float tension = id(reveil_batt_voltage).has_state() ? id(reveil_batt_voltage).state : NAN;
          const float courant = id(reveil_batt_current).has_state() ? id(reveil_batt_current).state : NAN;
          // Ne transmettre que les mesures réellement renouvelées par INA226.
          // Une valeur inchangée reste une nouvelle mesure si on_value a été appelé.
          static uint32_t tension_traitee_ms = 0;
          static uint32_t courant_traite_ms = 0;
          if (id(reveil_voltage_sample_ms) != 0 &&
              id(reveil_voltage_sample_ms) != tension_traitee_ms && std::isfinite(tension)) {
            tension_traitee_ms = id(reveil_voltage_sample_ms);
            chargeur_lecture(controle_charge, tension, millis());
          }
          if (id(reveil_current_sample_ms) != 0 &&
              id(reveil_current_sample_ms) != courant_traite_ms && std::isfinite(courant)) {
            courant_traite_ms = id(reveil_current_sample_ms);
            chargeur_lecture_courant(controle_charge, courant, millis());
          }
          const bool temperature_fraiche =
            id(reveil_temperature_sample_ms) != 0 &&
            (uint32_t)(millis() - id(reveil_temperature_sample_ms)) <= 30000UL &&
            id(reveil_cpu_temperature).has_state() &&
            std::isfinite(id(reveil_cpu_temperature).state);
          chargeur_surveillance_thermique(controle_charge,
            temperature_fraiche ? id(reveil_cpu_temperature).state : NAN, millis());
          // Exécute la machine d'états d'origine : repos de sonde 8 s,
          // contrôle présence, limite 80/100 %, sonde périodique et verrous.
          const uint8_t limite = id(reveil_charge_limit).current_option() == "80 %" ? 1 : 0;
          const ActionChargeur decision = chargeur_tick(controle_charge, limite,
            id(reveil_battery_installed).state, millis());
          // Persistance du souvenir de batterie et du verrou thermique.
          // Le verrou est conservé après redémarrage et empêche toute charge.
          const uint8_t next_memory = batterie_memoire_suivante(controle_charge, id(reveil_battery_memory));
          if (next_memory != id(reveil_battery_memory)) id(reveil_battery_memory) = next_memory;
          if (id(reveil_charge_thermal_latch) != controle_charge.verrou_thermique)
            id(reveil_charge_thermal_latch) = controle_charge.verrou_thermique;
          const bool charge_bloquee = id(reveil_charge_thermal_latch) || chargeur_securite_posee(controle_charge);
          id(reveil_battery_charger_locked).publish_state(charge_bloquee ? 1.0f : 0.0f);
          const SignalSecurite signal = chargeur_signal_prendre(controle_charge);
          if (signal.cause != CauseSecurite::AUCUNE) {
            char message[96];
            snprintf(message, sizeof(message), "cause=%d;mesure=%.2f;verrou=%d",
              (int)signal.cause, signal.mesure, signal.verrouille ? 1 : 0);
            id(mqtt_client).publish(std::string("reveil-tab5/batterie/securite"), std::string(message), 0, true);
          }
          // La machine d'états demande une lecture de confirmation :
          // forcer un vrai cycle INA226, pas recycler le dernier état publié.
          if (decision.lire) id(reveil_ina226).update();
          // Reprise du pilotage original : la sortie physique suit la
          // machine d'états, sans désynchronisation entre c.allume et CHG_EN.
          // Sonde, seuils, limite 80 %, réveil et verrous restent internes.
          // Sécurité additionnelle : aucune activation sur température périmée.
          const bool activer = decision.allumer && temperature_fraiche;
          if (!activer && id(reveil_charge_fast).state) id(reveil_charge_fast).turn_off();
          if (id(reveil_charge_enable).state != activer) {
            ESP_LOGI("reveil.batterie", "Chargeur %s, presence=%d, sonde=%d, reveil=%d",
              activer ? "ON" : "OFF", (int)controle_charge.presence,
              controle_charge.sonde ? 1 : 0, controle_charge.reveil ? 1 : 0);
            if (activer) id(reveil_charge_enable).turn_on();
            else id(reveil_charge_enable).turn_off();
          }
          const bool rapide = activer &&
            id(reveil_charge_mode).current_option() == "Rapide";
          if (id(reveil_charge_fast).state != rapide) {
            if (rapide) id(reveil_charge_fast).turn_on();
            else id(reveil_charge_fast).turn_off();
          }
          // Le cycle de réveil/sonde est piloté exclusivement par chargeur_tick().
          // Comme l'original, la présence mesurée est indépendante de la
          // déclaration « Batterie montée » (qui pilote l'affichage/réveil).
          const bool mesures_fraiches =
            id(reveil_voltage_sample_ms) != 0 &&
            id(reveil_current_sample_ms) != 0 &&
            (uint32_t)(millis() - id(reveil_voltage_sample_ms)) <= 30000UL &&
            (uint32_t)(millis() - id(reveil_current_sample_ms)) <= 30000UL;
          const bool batt_present = mesures_fraiches &&
            controle_charge.presence == PresenceBatterie::PRESENTE &&
            id(reveil_batt_voltage).has_state() &&
            std::isfinite(id(reveil_batt_voltage).state) &&
            id(reveil_batt_voltage).state >= 5.5f && id(reveil_batt_voltage).state <= 8.45f;
          // Le courant positif indique une décharge sur la batterie.
          // Hystérésis identique à tab5_economie.h (entrée 50 mA,
          // sortie 20 mA) ; conserver le dernier état pendant les sondes.
          static bool on_battery = false;
          if (!batt_present) on_battery = false;
          else if (!chargeur_en_sonde(controle_charge, millis()) &&
                   id(reveil_batt_current).has_state() && std::isfinite(courant)) {
            if (courant >= 0.050f) on_battery = true;
            else if (courant <= 0.020f) on_battery = false;
          }
          // Indicateur de présence : ne pas confondre batterie déclarée et détectée.
          // CHG_STAT détecte la charge, et le courant positif la décharge.
          // « Sur USB » reste une inférence en dehors de ces deux états.
          // Indicateurs d'état : courant positif = alimentation par batterie.
          // En l'absence de mesure fraîche, conserver le dernier état connu.
          static bool power_on_battery = false;
          if (mesures_fraiches && batt_present) power_on_battery = on_battery;
          lv_label_set_text(id(reveil_power_icon), power_on_battery ? "\U000F0079" : "\U000F06A5");
          lv_obj_set_style_text_color(id(reveil_power_icon),
            lv_color_hex(power_on_battery ? 0x4DA6E8 : 0x00CC33), LV_PART_MAIN);
          const bool wifi_ok = wifi::global_wifi_component != nullptr && wifi::global_wifi_component->is_connected();
          lv_obj_set_style_text_color(id(reveil_wifi_icon),
            lv_color_hex(wifi_ok ? 0x00CC33 : 0x535B65), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(reveil_ha_icon),
            lv_color_hex(id(reveil_ha_connected) ? 0x2196F3 : 0x535B65), LV_PART_MAIN);
          const std::string power_mode = id(reveil_power_save).current_option();
          const bool eco_screen = power_mode == "Toujours" ||
            (power_mode == "Sur batterie" && on_battery);
          static int previous_screen_pct = -1;
          const int requested_screen_pct = (int)(id(brightness_level).state * 10.0f);
          const int effective_screen_pct = eco_screen ? std::min(requested_screen_pct, 30) : requested_screen_pct;
          if (effective_screen_pct != previous_screen_pct) {
            previous_screen_pct = effective_screen_pct;
            auto call = id(backlight).turn_on();
            call.set_brightness(effective_screen_pct / 100.0f);
            call.perform();
          }
          // Wi-Fi éco conservé comme préférence : ne pas couper le réseau
          // nécessaire à la synchronisation SNTP et à la radio.
          // Diagnostics locaux, sans dépendance aux entités domotiques du projet HMI.
          set_label_if_changed(id(sys_ssid), id(reveil_ssid).has_state() ? id(reveil_ssid).state.c_str() : "--");
          set_label_if_changed(id(sys_ip), id(reveil_ip).has_state() ? id(reveil_ip).state.c_str() : "--");
          // Connexion à un client de l'API native (HA ou autre client ESPHome).
          set_label_if_changed(id(sys_ha), id(reveil_ha_connected) ? "Connecté" : "Non connecté");
          char diag[48];
          if (id(reveil_wifi_signal).has_state() && std::isfinite(id(reveil_wifi_signal).state)) {
            snprintf(diag, sizeof(diag), "%.0f dBm", id(reveil_wifi_signal).state);
            set_label_if_changed(id(sys_rssi), diag);
          } else set_label_if_changed(id(sys_rssi), "Indisponible");
          if (id(reveil_uptime).has_state() && std::isfinite(id(reveil_uptime).state)) {
            const uint32_t secondes = (uint32_t) id(reveil_uptime).state;
            snprintf(diag, sizeof(diag), "%u j %02u h %02u min",
              (unsigned)(secondes / 86400), (unsigned)((secondes / 3600) % 24),
              (unsigned)((secondes / 60) % 60));
            set_label_if_changed(id(sys_uptime), diag);
          } else set_label_if_changed(id(sys_uptime), "Indisponible");
          snprintf(diag, sizeof(diag), "%u / %u Ko",
            (unsigned)(heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
            (unsigned)(heap_caps_get_total_size(MALLOC_CAP_INTERNAL) / 1024));
          set_label_if_changed(id(sys_sram), diag);
          snprintf(diag, sizeof(diag), "%u / %u Ko",
            (unsigned)(heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
            (unsigned)(heap_caps_get_total_size(MALLOC_CAP_SPIRAM) / 1024));
          set_label_if_changed(id(sys_psram), diag);
          snprintf(diag, sizeof(diag), "%u Ko", (unsigned)(heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024)); set_label_if_changed(id(sys_bloc), diag);
          if (id(reveil_cpu_temperature).has_state() &&
              std::isfinite(id(reveil_cpu_temperature).state)) {
            snprintf(diag, sizeof(diag), "%.1f °C", id(reveil_cpu_temperature).state);
            set_label_if_changed(id(sys_temp), diag);
          } else set_label_if_changed(id(sys_temp), "Non mesurée");
          // Utilisation CPU mesurée à partir du temps idle FreeRTOS.
          #if defined(configGENERATE_RUN_TIME_STATS) && configGENERATE_RUN_TIME_STATS
          {
            static uint32_t last_idle = 0;
            static uint32_t last_total = 0;
            const TaskHandle_t idle_task = xTaskGetIdleTaskHandleForCore(0);
            const uint32_t idle_now = idle_task ? ulTaskGetRunTimeCounter(idle_task) : 0;
            const uint32_t total_now = portGET_RUN_TIME_COUNTER_VALUE();
            if (last_total && total_now != last_total) {
              const uint32_t delta_total = total_now - last_total;
              const uint32_t delta_idle = idle_now - last_idle;
              const float load = 100.0f * (1.0f - std::min(1.0f, (float)delta_idle / delta_total));
              snprintf(diag, sizeof(diag), "%.0f %%", load);
              set_label_if_changed(id(sys_cpu), diag);
            }
            last_idle = idle_now;
            last_total = total_now;
          }
          #else
          set_label_if_changed(id(sys_cpu), "Indisponible");
          #endif
          if (batt_present) {
            snprintf(diag, sizeof(diag), "%.2f V", id(reveil_batt_voltage).state);
            for (char *p = diag; *p; ++p) if (*p == '.') *p = ',';
            set_label_if_changed(id(reveil_batt_tension), diag);
            set_label_if_changed(id(sys_batt), diag);
            set_label_if_changed(id(reveil_batt_etat), on_battery ? "Sur batterie" :
              (id(reveil_battery_charging).state && activer ? "En charge" : "Sur USB"));
            if (std::isfinite(id(reveil_batt_current).state)) {
              const float power = id(reveil_batt_voltage).state * id(reveil_batt_current).state;
              snprintf(diag, sizeof(diag), "%+.2f W", power);
              for (char *p = diag; *p; ++p) if (*p == '.') *p = ',';
              set_label_if_changed(id(reveil_batt_conso), diag);
            } else {
              set_label_if_changed(id(reveil_batt_conso), "--");
            }
            // Même fonction de conversion que le firmware 3.9.1.
            const float pct = batterie_niveau_pct(tension);
            id(reveil_batterie_pourcentage).publish_state(pct);
            if (on_battery && std::isfinite(courant)) id(reveil_batterie_puissance).publish_state(std::max(0.0f, tension * courant));
            else id(reveil_batterie_puissance).publish_state(NAN);
            // Alertes une seule fois par seuil lors d'une décharge, réarmées à 30 %.
            if (!on_battery || pct >= 30.0f) id(reveil_battery_alert_level) = 0;
            if (on_battery && pct <= 10.0f && id(reveil_battery_alert_level) < 2) {
              id(reveil_battery_alert_level) = 2;
              id(mqtt_client).publish(std::string("reveil-tab5/batterie/alerte"), std::string("critique_10"), 0, false);
            } else if (on_battery && pct <= 20.0f && id(reveil_battery_alert_level) < 1) {
              id(reveil_battery_alert_level) = 1;
              id(mqtt_client).publish(std::string("reveil-tab5/batterie/alerte"), std::string("faible_20"), 0, false);
            }
            snprintf(diag, sizeof(diag), on_battery ? "%.0f %%" : "+%.0f %%", pct);
            set_label_if_changed(id(reveil_batt_niveau), diag);
          } else {
            id(reveil_batterie_pourcentage).publish_state(NAN);
            id(reveil_batterie_puissance).publish_state(NAN);
            id(reveil_battery_alert_level) = 0;
            set_label_if_changed(id(sys_batt), "Non détectée");
            set_label_if_changed(id(reveil_batt_etat),
            id(reveil_battery_installed).state ? "Mesure absente / batterie à vérifier" : "Non installée");
            set_label_if_changed(id(reveil_batt_tension), "--");
            set_label_if_changed(id(reveil_batt_niveau), "--");
            set_label_if_changed(id(reveil_batt_conso), "--");
          }
          char clock_value[16];
          snprintf(clock_value, sizeof(clock_value), "%02d", id(manual_hour));
          set_label_if_changed(id(clock_hour_label), clock_value);
          snprintf(clock_value, sizeof(clock_value), "%02d", id(manual_minute));
          set_label_if_changed(id(clock_minute_label), clock_value);
          lv_obj_set_style_bg_color(id(clock_wifi_button), lv_color_hex(!id(manual_clock) ? 0x00AD22 : 0x304458), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(clock_manual_button), lv_color_hex(id(manual_clock) ? 0x00AD22 : 0x304458), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(reveil_wifi_icon), lv_color_hex(id(reveil_ip).has_state() && !id(reveil_ip).state.empty() && id(reveil_ip).state != "0.0.0.0" ? 0x00AD22 : 0x535B65), LV_PART_MAIN);
          set_label_if_changed(id(clock_mode_label), id(manual_clock) ? "Mode manuel actif" : (t.is_valid() ? "Mode Wi-Fi actif" : "Wi-Fi : non synchronise"));
          if (id(alarm_ringing)) {
            lv_obj_remove_flag(id(alarm_snooze_main_button), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(alarm_stop_main_button), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(alarm_snooze_main_button), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(alarm_stop_main_button), LV_OBJ_FLAG_HIDDEN);
          }
          set_label_if_changed(id(alarm_one_label), id(alarm_one_enabled).state ? "ON" : "OFF");
          static int last_one_enabled = -1;
          int one_enabled = id(alarm_one_enabled).state ? 1 : 0;
          if (one_enabled != last_one_enabled) {
            last_one_enabled = one_enabled;
            lv_obj_set_style_bg_color(id(alarm_one_button), lv_color_hex(one_enabled ? 0x00AD22 : 0x535B65), LV_PART_MAIN);
          }
          // Retour MQTT uniquement lors d'un changement de configuration.
          static std::string last_mqtt_alarm_state;
          char alarm_mqtt[100];
          snprintf(alarm_mqtt, sizeof(alarm_mqtt), "A1=%s,%02d:%02d;A2=%s,%02d:%02d",
            id(alarm_one_enabled).state ? "ON" : "OFF",
            (int) id(alarm_one_hour).state, (int) id(alarm_one_minute).state,
            id(alarm_two_enabled).state ? "ON" : "OFF",
            (int) id(alarm_two_hour).state, (int) id(alarm_two_minute).state);
          if (last_mqtt_alarm_state != alarm_mqtt) {
            last_mqtt_alarm_state = alarm_mqtt;
            id(mqtt_client).publish("reveil-tab5/alarmes/etat", alarm_mqtt, 0, true);
          }
          set_label_if_changed(id(alarm_two_label), id(alarm_two_enabled).state ? "ON" : "OFF");
          static int last_two_enabled = -1;
          int two_enabled = id(alarm_two_enabled).state ? 1 : 0;
          if (two_enabled != last_two_enabled) {
            last_two_enabled = two_enabled;
            lv_obj_set_style_bg_color(id(alarm_two_button), lv_color_hex(two_enabled ? 0x00AD22 : 0x535B65), LV_PART_MAIN);
          }
          char value[16];
          snprintf(value, sizeof(value), "%.0f/10", id(brightness_level).state);
          set_label_if_changed(id(brightness_label), value);
          snprintf(value, sizeof(value), "%.0f/10", id(volume_level).state);
          set_label_if_changed(id(volume_label), value);
          const std::string radio_names[] = {id(radio_name_1).state, id(radio_name_2).state, id(radio_name_3).state, id(radio_name_4).state, id(radio_name_5).state, id(radio_name_6).state, id(radio_name_7).state, id(radio_name_8).state, id(radio_name_9).state, id(radio_name_10).state, id(radio_name_11).state, id(radio_name_12).state};
          set_label_if_changed(id(radio_station_label_1), radio_names[0].c_str());
          set_label_if_changed(id(radio_station_label_2), radio_names[1].c_str());
          set_label_if_changed(id(radio_station_label_3), radio_names[2].c_str());
          set_label_if_changed(id(radio_station_label_4), radio_names[3].c_str());
          set_label_if_changed(id(radio_station_label_5), radio_names[4].c_str());
          set_label_if_changed(id(radio_station_label_6), radio_names[5].c_str());
          set_label_if_changed(id(radio_station_label_7), radio_names[6].c_str());
          set_label_if_changed(id(radio_station_label_8), radio_names[7].c_str());
          set_label_if_changed(id(radio_station_label_9), radio_names[8].c_str());
          set_label_if_changed(id(radio_station_label_10), radio_names[9].c_str());
          set_label_if_changed(id(radio_station_label_11), radio_names[10].c_str());
          set_label_if_changed(id(radio_station_label_12), radio_names[11].c_str());
          // Sur la page Stations radio, la station sélectionnée apparaît en vert.
          // Actualisation aussi après un changement par MQTT ou par les commandes radio.
          lv_obj_t *station_buttons[] = {
            id(radio_station_button_1), id(radio_station_button_2),
            id(radio_station_button_3), id(radio_station_button_4),
            id(radio_station_button_5), id(radio_station_button_6),
            id(radio_station_button_7), id(radio_station_button_8),
            id(radio_station_button_9), id(radio_station_button_10),
            id(radio_station_button_11), id(radio_station_button_12)
          };
          static int last_highlighted_radio = -1;
          const int highlighted_radio = id(radio_slot);
          if (highlighted_radio != last_highlighted_radio) {
            last_highlighted_radio = highlighted_radio;
            for (int i = 0; i < 12; ++i) {
              lv_obj_set_style_bg_color(station_buttons[i],
                lv_color_hex(i == highlighted_radio ? 0x008F36 : 0x304458), LV_PART_MAIN);
            }
          }
          set_label_if_changed(id(radio_button_label), id(radio_manual) ? "Radio ON" : "Radio");
          const std::string station_texte = std::string("Station : ") + id(reveil_station_radio).current_option();
          set_label_if_changed(id(reveil_station_label), station_texte.c_str());
          set_label_if_changed(id(settings_title), id(selected_alarm) == 1 ? "Alarme 1" : "Alarme 2");
          snprintf(value, sizeof(value), "%02d", (int)(id(selected_alarm) == 1 ? id(alarm_one_hour).state : id(alarm_two_hour).state));
          set_label_if_changed(id(settings_hour), value);
          snprintf(value, sizeof(value), "%02d", (int)(id(selected_alarm) == 1 ? id(alarm_one_minute).state : id(alarm_two_minute).state));
          set_label_if_changed(id(settings_minute), value);
          snprintf(value, sizeof(value), "%d/10", id(selected_alarm) == 1 ? id(alarm_one_volume) : id(alarm_two_volume));
          set_label_if_changed(id(settings_volume), value);
          // Toujours rendre le volume visible lors de l'ouverture des deux alarmes.
          lv_obj_clear_flag(id(settings_volume), LV_OBJ_FLAG_HIDDEN);
          bool radio_choisie = id(selected_alarm) == 1 ? id(alarm_one_radio) : id(alarm_two_radio);
          lv_obj_set_style_bg_color(id(alarm_radio_button), lv_color_hex(radio_choisie ? 0x00AD22 : 0x304458), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(alarm_buzzer_button), lv_color_hex(!radio_choisie ? 0x00AD22 : 0x304458), LV_PART_MAIN);
          set_label_if_changed(id(alarm_test_label), id(alarm_test_active) ? "Arrêter le test" : "Tester");
          set_label_if_changed(id(preset_edit_label), id(preset_edit) ? "Annuler la modification" : "Modifier les préréglages");
          if (id(preset_edit) && id(preset_selected) >= 0) lv_obj_clear_flag(id(preset_save_button), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(preset_save_button), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_style_bg_color(id(preset_button_1), lv_color_hex(id(preset_selected) == 0 ? 0x00AD22 : 0x075BA8), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(preset_button_2), lv_color_hex(id(preset_selected) == 1 ? 0x00AD22 : 0x075BA8), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(preset_button_3), lv_color_hex(id(preset_selected) == 2 ? 0x00AD22 : 0x075BA8), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(preset_button_4), lv_color_hex(id(preset_selected) == 3 ? 0x00AD22 : 0x075BA8), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(preset_button_5), lv_color_hex(id(preset_selected) == 4 ? 0x00AD22 : 0x075BA8), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(preset_button_6), lv_color_hex(id(preset_selected) == 5 ? 0x00AD22 : 0x075BA8), LV_PART_MAIN);
          const int preset_minutes[] = {id(preset_1),id(preset_2),id(preset_3),id(preset_4),id(preset_5),id(preset_6)};
          lv_obj_t *preset_labels[] = {id(preset_label_1),id(preset_label_2),id(preset_label_3),id(preset_label_4),id(preset_label_5),id(preset_label_6)};
          for (int i = 0; i < 6; ++i) {
            char preset_text[16];
            snprintf(preset_text, sizeof(preset_text), "%02d:%02d", preset_minutes[i]/60, preset_minutes[i]%60);
            set_label_if_changed(preset_labels[i], preset_text);
          }
          snprintf(value, sizeof(value), "%02d:%02d", (int) id(alarm_one_hour).state, (int) id(alarm_one_minute).state);
          set_label_if_changed(id(alarm_one_time_label), value);
          snprintf(value, sizeof(value), "%02d:%02d", (int) id(alarm_two_hour).state, (int) id(alarm_two_minute).state);
          set_label_if_changed(id(alarm_two_time_label), value);
          if (id(alarm_ringing) && !id(active_alarm_radio) && !id(alarm_buzzer).is_playing()) {
            id(alarm_buzzer).set_gain((id(selected_alarm) == 1
              ? id(alarm_one_volume) : id(alarm_two_volume)) / 10.0f);
            id(alarm_buzzer).play("reveil:d=8,o=5,b=120:c6,p,c6,p,g5,p,g5,p");
          }
          // Le snooze utilise millis() : il doit fonctionner même si le Wi-Fi
          // et l'heure SNTP deviennent indisponibles après la première sonnerie.
          const bool snooze_due = id(snooze_pending) &&
            (int32_t)(millis() - id(snooze_deadline_ms)) >= 0;
          if (snooze_due && !id(alarm_ringing)) {
            id(snooze_pending) = false;
            id(start_alarm).execute();
          }
          // En mode manuel, réarmer dès que l'horloge quitte la minute
          // de la dernière sonnerie : le réveil se répète ainsi chaque jour.
          if (id(manual_clock) && clock_valid &&
              shown_hour * 60 + shown_minute != id(last_alarm_minute)) {
            id(last_alarm_minute) = -1;
          }
          if (!offline_clock && clock_valid && !id(alarm_ringing) && !id(snooze_pending) && !snooze_due) {
            // En mode SNTP, l'horodatage absolu distingue les deux occurrences
            // de la même heure lors du passage à l'heure d'hiver.
            const int minute_key = id(manual_clock)
              ? (shown_hour * 60 + shown_minute) : (int)(t.timestamp / 60);
            const bool match_one = id(alarm_one_enabled).state &&
              shown_hour == (int) id(alarm_one_hour).state &&
              shown_minute == (int) id(alarm_one_minute).state &&
              (id(manual_clock) || (int64_t)(t.timestamp / 60) != id(alarm_one_last_epoch_minute));
            const bool match_two = id(alarm_two_enabled).state &&
              shown_hour == (int) id(alarm_two_hour).state &&
              shown_minute == (int) id(alarm_two_minute).state &&
              (id(manual_clock) || (int64_t)(t.timestamp / 60) != id(alarm_two_last_epoch_minute));
            if (minute_key != id(last_alarm_minute) && (match_one || match_two)) {
              if (!id(manual_clock)) {
                if (match_one) id(alarm_one_last_epoch_minute) = (int64_t)(t.timestamp / 60);
                if (match_two) id(alarm_two_last_epoch_minute) = (int64_t)(t.timestamp / 60);
              }
              id(last_alarm_minute) = minute_key;
              // Deux alarmes à la même minute : Réveil 1 sonne en premier,
              // Réveil 2 attend l'arrêt explicite de la première sonnerie.
              id(alarm_two_queued) = match_one && match_two;
              id(selected_alarm) = match_one ? 1 : 2;
              id(active_alarm_radio) = id(selected_alarm) == 1
                ? id(alarm_one_radio) : id(alarm_two_radio);
              id(start_alarm).execute();
            }
          }
