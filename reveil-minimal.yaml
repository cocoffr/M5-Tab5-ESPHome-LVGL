interval:
  - interval: 1s
    then:
      - lambda: |-
          auto t = id(clock_time).now();
          if (t.is_valid()) {
            const uint8_t map[10] = {0x3F, 0x06, 0x5B, 0x4F, 0x66, 0x6D, 0x7D, 0x07, 0x7F, 0x6F};
            int digits[4] = {t.hour / 10, t.hour % 10, t.minute / 10, t.minute % 10};
            lv_obj_set_style_bg_color(id(digit_0_0), lv_color_hex((map[digits[0]] & (1 << 0)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_0_1), lv_color_hex((map[digits[0]] & (1 << 1)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_0_2), lv_color_hex((map[digits[0]] & (1 << 2)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_0_3), lv_color_hex((map[digits[0]] & (1 << 3)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_0_4), lv_color_hex((map[digits[0]] & (1 << 4)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_0_5), lv_color_hex((map[digits[0]] & (1 << 5)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_0_6), lv_color_hex((map[digits[0]] & (1 << 6)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_1_0), lv_color_hex((map[digits[1]] & (1 << 0)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_1_1), lv_color_hex((map[digits[1]] & (1 << 1)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_1_2), lv_color_hex((map[digits[1]] & (1 << 2)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_1_3), lv_color_hex((map[digits[1]] & (1 << 3)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_1_4), lv_color_hex((map[digits[1]] & (1 << 4)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_1_5), lv_color_hex((map[digits[1]] & (1 << 5)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_1_6), lv_color_hex((map[digits[1]] & (1 << 6)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_2_0), lv_color_hex((map[digits[2]] & (1 << 0)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_2_1), lv_color_hex((map[digits[2]] & (1 << 1)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_2_2), lv_color_hex((map[digits[2]] & (1 << 2)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_2_3), lv_color_hex((map[digits[2]] & (1 << 3)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_2_4), lv_color_hex((map[digits[2]] & (1 << 4)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_2_5), lv_color_hex((map[digits[2]] & (1 << 5)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_2_6), lv_color_hex((map[digits[2]] & (1 << 6)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_3_0), lv_color_hex((map[digits[3]] & (1 << 0)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_3_1), lv_color_hex((map[digits[3]] & (1 << 1)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_3_2), lv_color_hex((map[digits[3]] & (1 << 2)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_3_3), lv_color_hex((map[digits[3]] & (1 << 3)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_3_4), lv_color_hex((map[digits[3]] & (1 << 4)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_3_5), lv_color_hex((map[digits[3]] & (1 << 5)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(digit_3_6), lv_color_hex((map[digits[3]] & (1 << 6)) ? 0xF5F5F5 : 0x101820), LV_PART_MAIN);
          }
          lv_label_set_text(id(alarm_one_label), id(alarm_one_enabled).state ? "ALARME 1 ON" : "ALARME 1 OFF");
          lv_label_set_text(id(alarm_two_label), id(alarm_two_enabled).state ? "ALARME 2 ON" : "ALARME 2 OFF");
          char value[16];
          snprintf(value, sizeof(value), "L %.0f", id(brightness_level).state);
          lv_label_set_text(id(brightness_label), value);
          snprintf(value, sizeof(value), "V %.0f", id(volume_level).state);
          lv_label_set_text(id(volume_label), value);
          lv_label_set_text(id(radio_button_label), id(radio_manual) ? "RADIO ON" : "RADIO OFF");
          snprintf(value, sizeof(value), "%02d:%02d", (int) id(alarm_one_hour).state, (int) id(alarm_one_minute).state);
          lv_label_set_text(id(alarm_one_time_label), value);
          snprintf(value, sizeof(value), "%02d:%02d", (int) id(alarm_two_hour).state, (int) id(alarm_two_minute).state);
          lv_label_set_text(id(alarm_two_time_label), value);
          if (t.is_valid()) {
            int minute_key = (int)(t.timestamp / 60);
            bool match_one = id(alarm_one_enabled).state && t.hour == (int) id(alarm_one_hour).state && t.minute == (int) id(alarm_one_minute).state;
            bool match_two = id(alarm_two_enabled).state && t.hour == (int) id(alarm_two_hour).state && t.minute == (int) id(alarm_two_minute).state;
            if (minute_key != id(last_alarm_minute) && (match_one || match_two || minute_key == id(snooze_until))) {
              id(last_alarm_minute) = minute_key;
              id(snooze_until) = -1;
              id(start_alarm).execute();
            }
          }
