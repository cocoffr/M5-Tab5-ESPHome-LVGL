name: Reveil minimal ST7121
on:
  workflow_dispatch:
  push:
    paths:
      - reveil-minimal.yaml
      - .github/workflows/reveil-minimal.yml
  pull_request:
    paths:
      - reveil-minimal.yaml
      - .github/workflows/reveil-minimal.yml
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build-only Wi-Fi credentials
        run: |
          printf 'wifi_ssid: "CI-only"\nwifi_password: "CI-placeholder-password"\n' > secrets.yaml
      - name: Compile isolated ST7121 firmware
        uses: esphome/build-action@v7
        with:
          yaml-file: reveil-minimal.yaml
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: reveil-minimal-st7121
          path: |
            .esphome/build/reveil-tab5/.pioenvs/reveil-tab5/firmware.factory.bin
            .esphome/build/reveil-tab5/.pioenvs/reveil-tab5/firmware.bin
          if-no-files-found: warn
