name: Reveil minimal ST7121
on:
  workflow_dispatch:
  push:
    paths:
      - reveil-minimal.yaml
      - .github/workflows/reveil-minimal.yml
  pull_request:
    paths:
      - reveil-minimal.yaml
      - .github/workflows/reveil-minimal.yml
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Restore ESP-IDF toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/esphome
          key: reveil-espidf-${{ runner.os }}-v5.5.6-${{ hashFiles('reveil-minimal.yaml') }}
          restore-keys: |
            reveil-espidf-${{ runner.os }}-v5.5.6-
      - name: Install ESPHome
        run: pip install --retries 5 --timeout 60 esphome
      - name: Prepare Wi-Fi credentials securely
        env:
          WIFI_SSID: ${{ secrets.REVEIL_WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.REVEIL_WIFI_PASSWORD }}
        run: |
          if [ -z "$WIFI_SSID" ] || [ -z "$WIFI_PASSWORD" ]; then
            echo "::error::Configure REVEIL_WIFI_SSID and REVEIL_WIFI_PASSWORD in GitHub Actions secrets before building a flashable firmware."
            exit 1
          fi
          python - <<'PY'
          import os, json
          with open("secrets.yaml", "w", encoding="utf-8") as f:
              f.write("wifi_ssid: " + json.dumps(os.environ["WIFI_SSID"]) + "\n")
              f.write("wifi_password: " + json.dumps(os.environ["WIFI_PASSWORD"]) + "\n")
          PY
      - name: Compile ST7121 firmware without unsupported manifest generation
        run: |
          for attempt in 1 2 3; do
            echo "Compilation attempt ${attempt}/3"
            if esphome compile reveil-minimal.yaml; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::ESPHome compilation failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 30))
          done
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: reveil-minimal-st7121
          path: |
            .esphome/build/reveil-tab5/build/firmware.factory.bin
            .esphome/build/reveil-tab5/build/firmware.ota.bin
          if-no-files-found: error
