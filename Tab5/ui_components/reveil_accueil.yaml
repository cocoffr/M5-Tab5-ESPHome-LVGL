# Accueil dédié réveil de chevet — premier jalon fonctionnel.
# L'ancienne interface reste compilée derrière cette surface pour conserver
# les références LVGL des composants existants.
- obj:
    id: reveil_accueil
    align: TOP_LEFT
    x: 0
    y: 0
    width: 1280
    height: 720
    bg_color: 0x101820
    bg_opa: COVER
    border_width: 0
    radius: 0
    pad_all: 0
    scrollable: false
    widgets:
      - label:
          id: reveil_alimentation
          text: "Réveil"
          x: 24
          y: 15
          text_color: 0x80DDAA
          text_font: roboto_32_b
      - label:
          id: reveil_date
          text: ""
          align: TOP_MID
          y: 15
          text_color: 0xFFFFFF
          text_font: roboto_32_b
      - button:
          x: 1180
          y: 12
          width: 72
          height: 55
          on_click:
            - script.execute: tab5_reglages_ouvrir
          widgets:
            - label:
                text: "Menu"
                align: CENTER
      - label:
          id: reveil_geant_heure
          text: "--:--"
          align: TOP_MID
          y: 75
          text_font: reveil_geant_font
          text_color: 0xFFFFFF
      - button:
          x: 24
          y: 530
          width: 600
          height: 78
          on_click:
            - script.execute: tab5_alarm_open
          widgets:
            - label:
                id: reveil_alarme1_texte
                text: "Alarme 1"
                align: LEFT_MID
                x: 20
                text_font: roboto_32_b
            - label:
                id: reveil_alarme1_heure
                text: "07:00"
                align: CENTER
                text_font: roboto_32_b
      - button:
          x: 635
          y: 530
          width: 600
          height: 78
          on_click:
            - script.execute: tab5_alarm_open
          widgets:
            - label:
                id: reveil_alarme2_texte
                text: "Alarme 2"
                align: LEFT_MID
                x: 20
                text_font: roboto_32_b
            - label:
                id: reveil_alarme2_heure
                text: "08:30"
                align: CENTER
                text_font: roboto_32_b
      - button:
          x: 25
          y: 630
          width: 95
          height: 65
          on_click:
            - light.dim_relative:
                id: backlight
                relative_brightness: -10%
          widgets:
            - label: { text: "−", align: CENTER, text_font: roboto_32_b }
      - label:
          text: "Lum."
          x: 145
          y: 645
          text_font: roboto_32_b
      - button:
          x: 220
          y: 630
          width: 95
          height: 65
          on_click:
            - light.dim_relative:
                id: backlight
                relative_brightness: 10%
          widgets:
            - label: { text: "+", align: CENTER, text_font: roboto_32_b }
      - button:
          x: 510
          y: 630
          width: 260
          height: 65
          on_click:
            - script.execute: tab5_alarm_open
          widgets:
            - label: { text: "Radio", align: CENTER, text_font: roboto_32_b }
      - label:
          text: "Volume"
          x: 870
          y: 645
          text_font: roboto_32_b
      - button:
          x: 1030
          y: 630
          width: 90
          height: 65
          widgets:
            - label: { text: "−", align: CENTER, text_font: roboto_32_b }
      - button:
          x: 1145
          y: 630
          width: 90
          height: 65
          widgets:
            - label: { text: "+", align: CENTER, text_font: roboto_32_b }
