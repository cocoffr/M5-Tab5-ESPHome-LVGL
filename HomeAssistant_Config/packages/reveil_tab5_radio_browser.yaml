# Recherche Radio Browser et synchronisation des 12 favoris du réveil Tab5.
# Installer dans les packages Home Assistant ; redémarrer HA après installation.
# Le Tab5 reçoit les changements via MQTT reveil-tab5/radio/favori/set
# et renvoie chaque favori sur reveil-tab5/radio/favori/{1..12} (retained).
#
# Mode d'emploi :
# 1. Exécuter script.reveil_tab5_radio_browser_chercher avec le nom voulu.
# 2. Lire la notification : numéros 1 à 10, noms et flux disponibles.
# 3. Exécuter script.reveil_tab5_radio_browser_favori avec emplacement,
#    nom recherché et numéro du résultat choisi (défaut 1).
# 4. Vérifier l'actualisation du bouton correspondant sur le Tab5.
#
# Remarque : Radio Browser répertorie des URL, mais ne garantit pas que chaque
# flux est lisible par le décodeur audio ESPHome du Tab5.
rest_command:
  reveil_tab5_radio_browser_search:
    url: "https://de1.api.radio-browser.info/json/stations/search"
    method: POST
    content_type: "application/json"
    headers:
      User-Agent: "HomeAssistant-ReveilTab5/1.0"
    payload: >-
      {{ {'name': nom, 'hidebroken': 'true', 'limit': 25, 'order': 'votes', 'reverse': 'true'} | to_json }}
    timeout: 20

script:
  reveil_tab5_radio_tester:
    alias: "Réveil Tab5 — tester une station"
    description: "Demande au Tab5 de lire l'un des 12 favoris et publie un diagnostic MQTT. Nécessite le firmware mis à jour."
    mode: queued
    fields:
      emplacement:
        required: true
        selector:
          number:
            min: 1
            max: 12
            step: 1
            mode: box
    sequence:
      - condition: template
        value_template: "{{ 1 <= emplacement | int(0) <= 12 }}"
      - action: mqtt.publish
        data:
          topic: reveil-tab5/radio/test/slot
          payload: "{{ emplacement | int }}"
          qos: 1
          retain: false

  reveil_tab5_radio_browser_chercher:
    alias: "Réveil Tab5 — rechercher une station Radio Browser"
    mode: queued
    fields:
      nom:
        required: true
        selector:
          text: {}
    sequence:
      - action: rest_command.reveil_tab5_radio_browser_search
        data:
          nom: "{{ nom }}"
        response_variable: stations
      - variables:
          candidats: >-
            {{ stations.content if stations.status == 200 and stations.content is sequence and stations.content is not string else [] }}
          resultats: >-
            {{ candidats | selectattr('url_resolved', 'defined') | list }}
      - action: persistent_notification.create
        data:
          title: "Radio Browser — {{ nom }}"
          message: >-
            {% if resultats | count > 0 %}
              {% for s in resultats[:10] %}
                {{ loop.index }}. {{ s.name }} — {{ s.codec | default('?') }} — {{ s.url_resolved }}
              {% endfor %}
              Pour enregistrer : script « Réveil Tab5 — enregistrer un favori »,
              nom={{ nom }}, numéro du résultat et emplacement 1–12.
            {% else %}
              Aucune station trouvée ou service indisponible.
            {% endif %}

  reveil_tab5_radio_browser_favori:
    alias: "Réveil Tab5 — enregistrer un favori Radio Browser"
    description: "Choisir le numéro d'un résultat Radio Browser et l'envoyer au Tab5 via MQTT."
    mode: queued
    fields:
      emplacement:
        required: true
        selector:
          number:
            min: 1
            max: 12
            step: 1
            mode: box
      nom:
        required: true
        selector:
          text: {}
      resultat:
        description: "Numéro dans la liste des résultats (1 par défaut)"
        selector:
          number:
            min: 1
            max: 10
            step: 1
            mode: box
    sequence:
      - variables:
          slot: "{{ emplacement | int(0) }}"
          choix: "{{ resultat | default(1, true) | int(1) }}"
      - condition: template
        value_template: "{{ 1 <= slot <= 12 and 1 <= choix <= 10 and nom | trim | length > 0 }}"
      - action: rest_command.reveil_tab5_radio_browser_search
        data:
          nom: "{{ nom }}"
        response_variable: stations
      - variables:
          candidats: >-
            {{ stations.content if stations.status == 200 and stations.content is sequence and stations.content is not string else [] }}
          valides: >-
            {{ candidats | selectattr('url_resolved', 'defined') | list }}
      - condition: template
        value_template: "{{ valides | count >= choix }}"
      - variables:
          station: "{{ valides[choix - 1] }}"
          flux: "{{ station.url_resolved | default('', true) }}"
      - condition: template
        value_template: >-
          {{ flux.startswith('http://') or flux.startswith('https://') }}
      - condition: template
        value_template: "{{ flux | length <= 255 and station.name | length > 0 }}"
      - action: mqtt.publish
        data:
          topic: reveil-tab5/radio/favori/set
          payload: >-
            {{ {'slot': slot | int, 'name': station.name[:48], 'url': flux} | to_json }}
          qos: 1
          retain: false

  reveil_tab5_radio_browser_initialiser:
    alias: "Réveil Tab5 — rechercher les 12 stations par défaut"
    description: "Initialise les favoris un à un par Radio Browser. Contrôler les URL avant utilisation."
    mode: single
    sequence:
      - repeat:
          for_each:
            - "Chérie FM"
            - "Chérie FM 90"
            - "Chérie FM Acoustic"
            - "Rire et Chansons"
            - "France Inter"
            - "France Info"
            - "RTL"
            - "Europe 1"
            - "RFM"
            - "Nostalgie"
            - "NRJ"
            - "Fun Radio"
          sequence:
            - action: script.reveil_tab5_radio_browser_favori
              data:
                emplacement: "{{ repeat.index }}"
                nom: "{{ repeat.item }}"
                resultat: 1
